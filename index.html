<!DOCTYPE html>
<html lang="cs" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0F15">
<title>Cancún → Buenos Aires</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2244%22 fill=%22%230A0F15%22 stroke=%22%233DDCFF%22 stroke-width=%228%22/%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2212%22 fill=%22%23FFB347%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--bg:#0A0F15;--bg2:#0D141C;--panel:#101923;--panel2:#142030;--line:#1D2B3A;--tx:#E6F1FA;--mut:#8CA0B3;--acc:#3DDCFF;--acc2:#7C9CFF;--acc-tx:#04131A;--now:#FFB347;--done:#36D6A0;--next:#5A6B7D;--bad:#FF6B6B;--warn:#FFB347;--sea:#0A1722;--land:#17232F;--land-s:#2B3E52;--shadow:0 10px 30px rgba(0,0,0,.28)}
:root[data-theme="light"]{--bg:#EDF2F6;--bg2:#E3EAF0;--panel:#FFFFFF;--panel2:#F8FBFD;--line:#D3DDE6;--tx:#0F1B27;--mut:#587084;--acc:#0A8FB5;--acc2:#4562D6;--acc-tx:#FFFFFF;--now:#C77700;--done:#1E9E73;--next:#8A98A6;--bad:#D63B3B;--warn:#C77700;--sea:#D8E8F2;--land:#EEE8D8;--land-s:#BDB08C;--shadow:0 8px 24px rgba(15,27,39,.08)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(1100px 520px at 85% -10%,color-mix(in srgb,var(--acc) 10%,transparent),transparent 62%),var(--bg);color:var(--tx);font:15px/1.5 "Space Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
h1,h2,h3,h4{margin:0}
a{color:var(--acc)}
.mono,.lab{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
.lab{font-size:.68rem;letter-spacing:.13em;text-transform:uppercase;color:var(--mut)}
.hide{display:none!important}
svg{flex:none}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{background:var(--bg2);border-right:1px solid var(--line);color:var(--tx);padding:20px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;overflow:auto}
.brand{padding:4px 10px 18px;display:flex;gap:10px;align-items:center}
.brand i{width:30px;height:30px;border-radius:9px;background:radial-gradient(circle at 50% 50%,var(--now) 0 22%,transparent 24%),var(--panel);border:2px solid var(--acc);flex:none}
.brand b{display:block;font-size:.98rem;line-height:1.15}.brand small{color:var(--mut);font-size:.72rem}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;gap:12px;align-items:center;width:100%;padding:10px 12px;border:0;background:none;border-radius:11px;text-align:left;color:var(--mut);position:relative;font-size:.92rem}
.nav button:hover{background:color-mix(in srgb,var(--acc) 7%,transparent);color:var(--tx)}
.nav button.on{background:color-mix(in srgb,var(--acc) 13%,transparent);color:var(--acc);font-weight:600}
.nav button.on::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--acc)}
.nav .sep{height:1px;background:var(--line);margin:8px 6px}
.side .foot{margin-top:auto;padding:10px;font-size:.7rem;color:var(--mut)}
.main{padding:22px 24px 120px;max-width:1180px;width:100%;margin:0 auto}
.bnav{display:none;position:fixed;left:0;right:0;bottom:0;background:var(--bg2);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:30;justify-content:space-around;gap:2px}
.bnav button{flex:1;background:none;border:0;color:var(--mut);font-size:.64rem;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:10px;letter-spacing:.02em}
.bnav button.on{color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent)}
.sheet{position:fixed;left:10px;right:10px;bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:10px;z-index:31;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sheet button{background:var(--bg2);border:0;border-radius:12px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.78rem;color:var(--tx)}
@media(max-width:860px){.app{display:block}.side{display:none}.bnav{display:flex}.main{padding:14px 12px 130px}}
.view{display:none}.view.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.card+.card,.card+.grid2,.grid2+.card,.grid2+.grid2,.card+.stamps{margin-top:16px}
.card h3{font-size:.72rem;font-family:"JetBrains Mono",ui-monospace,monospace;letter-spacing:.13em;text-transform:uppercase;color:var(--mut);margin-bottom:12px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:900px){.grid2{grid-template-columns:1fr 1fr}.grid2.wide{grid-template-columns:1.25fr 1fr}.grid2.glob{grid-template-columns:1.15fr 1fr}}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin:2px 0 16px;flex-wrap:wrap}
.pagehead h2{font-size:1.6rem;letter-spacing:-.01em}.pagehead small{color:var(--mut)}
.note{font-size:.82rem;color:var(--mut);margin:0 0 12px}
.pill{display:inline-flex;gap:6px;align-items:center;font-family:"JetBrains Mono",monospace;font-size:.72rem;color:var(--acc);border:1px solid color-mix(in srgb,var(--acc) 40%,transparent);padding:3px 10px;border-radius:99px}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc);animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.35}}
.flag{display:inline-block;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);vertical-align:middle;flex:none}
.btn{border:1px solid var(--line);background:color-mix(in srgb,var(--panel2) 80%,transparent);border-radius:11px;padding:9px 14px;font-weight:600;font-size:.86rem;color:var(--tx);display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-tx)}.btn.pri:hover{filter:brightness(1.1);color:var(--acc-tx)}
.btn.sm{padding:6px 10px;font-size:.78rem;border-radius:9px}
.btn.bad{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1;min-width:120px}
input,select,textarea{width:100%;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--bg2);color:var(--tx);font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--acc) 55%,transparent);border-color:var(--acc)}
label.l{display:block;font-size:.66rem;font-family:"JetBrains Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:10px 0 4px}
.form{display:grid;gap:2px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{display:flex;gap:10px;align-items:center;text-align:left;background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:11px}
.tile:hover{border-color:var(--acc)}
.tile .ic{width:36px;height:36px;border-radius:10px;background:color-mix(in srgb,var(--acc) 12%,transparent);color:var(--acc);display:grid;place-items:center;flex:none}
.tile b{display:block;font-size:.88rem}.tile small{color:var(--mut);font-size:.72rem;line-height:1.2;display:block}
.tele .name{font-size:clamp(2rem,6vw,2.9rem);font-weight:700;line-height:1;color:var(--now);letter-spacing:-.02em}
.mets{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.met{background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:11px 12px}
.met b{display:block;font-family:"JetBrains Mono",monospace;font-size:1.35rem;color:var(--acc);line-height:1.2}
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px}
.sc{flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;padding:8px 8px;border-radius:12px;min-width:78px;text-align:center}
.sc b{font-size:.78rem}.sc small{color:var(--mut);font-size:.66rem;font-family:"JetBrains Mono",monospace}
.sc.done .flag{box-shadow:0 0 0 3px var(--done)}.sc.now .flag{box-shadow:0 0 0 3px var(--now),0 0 16px var(--now)}
.sc.now{background:color-mix(in srgb,var(--now) 10%,transparent)}
.prog{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--done));border-radius:6px}
.prog.warn i{background:var(--warn)}.prog.bad i{background:var(--bad)}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:13px;padding:10px 12px;background:color-mix(in srgb,var(--warn) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));border-left:3px solid var(--warn);margin-bottom:16px;font-size:.88rem}
.alert.bad{background:color-mix(in srgb,var(--bad) 12%,var(--panel));border-color:color-mix(in srgb,var(--bad) 40%,var(--line));border-left-color:var(--bad)}
.dotc{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;flex:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:4px}
.chip{flex:none;display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border:1px solid var(--line);background:var(--panel);border-radius:999px;font-size:.82rem}
.chip.on{background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc);border-color:var(--acc)}
.chip.cur{outline:2px solid var(--now);outline-offset:1px}
.seg{display:flex;gap:4px;background:var(--bg2);border-radius:12px;padding:4px;margin-bottom:12px;overflow-x:auto}
.seg button{flex:1 0 auto;border:0;background:none;padding:8px 12px;border-radius:9px;font-size:.84rem;font-weight:600;color:var(--mut);white-space:nowrap}
.seg button.on{background:var(--panel2);color:var(--acc);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 35%,transparent)}
.globewrap{position:relative;display:grid;place-items:center}
#globe{width:100%;max-width:520px;aspect-ratio:1;display:block;touch-action:none;cursor:grab}
.mapbox{position:relative}
#map{width:100%;height:auto;display:block;border-radius:13px;background:var(--sea);touch-action:none;cursor:grab;aspect-ratio:516/534}
#map.placing{cursor:crosshair;outline:3px solid var(--acc)}
.zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:1.05rem;font-weight:700;padding:0;color:var(--tx)}
.ctry{fill:var(--land);stroke:var(--land-s);stroke-width:.8}
.ctry path{vector-effect:non-scaling-stroke}
.ctry.plan{fill:color-mix(in srgb,var(--acc) 16%,var(--land))}
.ctry.done{fill:color-mix(in srgb,var(--done) 32%,var(--land))}
.ctry.now{fill:color-mix(in srgb,var(--now) 40%,var(--land))}
.grat{stroke:var(--tx);opacity:.07;vector-effect:non-scaling-stroke}
.cl{fill:var(--tx);opacity:.6;text-anchor:middle;font-weight:600;paint-order:stroke;stroke:var(--land);stroke-width:2.5px;pointer-events:none;font-family:"JetBrains Mono",monospace}
.route{fill:none;stroke:var(--acc);stroke-width:2;stroke-dasharray:5 4;vector-effect:non-scaling-stroke;opacity:.8}
.dline{fill:none;stroke:var(--done);stroke-width:2.6;vector-effect:non-scaling-stroke}
.pin{cursor:pointer}
.pin text{font-family:"JetBrains Mono",monospace;font-weight:700;fill:#04131A;text-anchor:middle;pointer-events:none}
.pin text.lbl{font-weight:600;fill:var(--tx);paint-order:stroke;stroke:var(--sea)}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--mut);font-size:.76rem;margin-top:10px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.hint{background:color-mix(in srgb,var(--acc) 12%,transparent);border:1px solid color-mix(in srgb,var(--acc) 35%,transparent);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:.88rem}
.stop{display:flex;gap:10px;align-items:center;padding:9px 8px;border-radius:11px;cursor:pointer;border-bottom:1px solid var(--line)}
.stop:last-child{border-bottom:0}
.stop.sel{background:color-mix(in srgb,var(--acc) 9%,transparent)}
.num{flex:none;width:28px;height:28px;border-radius:50%;color:#04131A;font-family:"JetBrains Mono",monospace;font-weight:700;font-size:.74rem;display:grid;place-items:center}
.sbody{flex:1;min-width:0}.sbody b{display:block;font-size:.92rem}.sbody small{display:block;color:var(--mut);font-size:.74rem}
.here{background:var(--now);color:#1a1000;border-radius:6px;padding:1px 7px;font-size:.62rem;margin-left:6px;font-weight:700;font-family:"JetBrains Mono",monospace;letter-spacing:.06em}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.diary{border-left:2px solid var(--line);padding:2px 0 2px 10px;margin:8px 0}
.diary small{color:var(--mut)}
.zhero{border-radius:16px;padding:18px;display:flex;gap:14px;align-items:center;margin-bottom:12px;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 16%,var(--panel)),var(--panel));border:1px solid var(--line)}
.zhero h2{font-size:1.5rem}.zhero small{color:var(--mut)}
.info ul{margin:0;padding-left:20px}.info li{margin:5px 0}
.info h4{margin:16px 0 6px;font-size:.72rem;font-family:"JetBrains Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:6px}
.fact{background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:11px}.fact small{color:var(--mut);display:block;font-size:.68rem;font-family:"JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase}.fact b{font-size:.92rem}
.season{background:color-mix(in srgb,var(--now) 10%,transparent);border-left:3px solid var(--now);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:.88rem}
.nowwx{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.nowwx .t{font-family:"JetBrains Mono",monospace;font-size:2.6rem;font-weight:600;line-height:1;color:var(--acc)}
.ch text{font-family:"JetBrains Mono",monospace;font-size:10px;fill:var(--mut)}
.legendc{display:flex;gap:14px;flex-wrap:wrap;font-size:.74rem;color:var(--mut);margin-top:4px}
.bar{display:grid;grid-template-columns:minmax(90px,1.1fr) 2fr auto 44px;gap:8px;align-items:center;margin:8px 0;font-size:.86rem}
.bar .w{height:8px;background:var(--line);border-radius:6px;overflow:hidden}.bar .w i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.bar em{color:var(--mut);font-style:normal;font-size:.74rem;text-align:right;font-family:"JetBrains Mono",monospace}
.news{border-left:3px solid var(--next)}.news.pozor{border-left-color:var(--warn)}.news.nebezpeci{border-left-color:var(--bad)}
.item{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item input[type=checkbox]{width:19px;height:19px;accent-color:var(--acc);flex:none}
.item .t{flex:1;min-width:0}.item.ck .t{text-decoration:line-through;color:var(--mut)}
.item small{color:var(--mut)}.item .x{border:0;background:none;color:var(--mut);font-size:1.05rem;padding:4px}
.tag{display:inline-block;border-radius:6px;padding:1px 8px;font-size:.66rem;font-weight:600;background:var(--line);font-family:"JetBrains Mono",monospace;letter-spacing:.05em}
.tag.ok{background:color-mix(in srgb,var(--done) 22%,var(--panel));color:var(--done)}
.tag.wait{background:color-mix(in srgb,var(--warn) 22%,var(--panel));color:var(--warn)}
.fab{position:fixed;right:18px;bottom:22px;z-index:25;border:0;border-radius:999px;padding:12px 20px;background:var(--done);color:#04131A;font-weight:700;box-shadow:0 6px 24px rgba(0,0,0,.4);max-width:80vw}
.fab:disabled{background:var(--panel2);color:var(--mut);border:1px solid var(--line)}
@media(max-width:860px){.fab{bottom:calc(76px + env(safe-area-inset-bottom,0px));right:12px}}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:14px}
.stamp{position:relative;border:2px solid var(--done);color:var(--done);border-radius:14px;padding:12px 8px 10px;text-align:center;transform:rotate(var(--r,0deg));background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--done) 7%,transparent) 6px 7px)}
.stamp::before{content:"";position:absolute;inset:3px;border:1px dashed currentColor;border-radius:10px;opacity:.5;pointer-events:none}
.stamp.now{color:var(--now);border-color:var(--now);box-shadow:0 0 20px color-mix(in srgb,var(--now) 30%,transparent);background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--now) 8%,transparent) 6px 7px)}
.stamp.plan{color:var(--next);border-style:dashed;opacity:.6;background:none}
.stamp b{display:block;font-family:"JetBrains Mono",monospace;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;margin-top:7px}
.stamp small{display:block;font-family:"JetBrains Mono",monospace;font-size:.66rem;opacity:.85}
.tl{position:relative;padding-left:28px}.tl::before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--acc),var(--line))}
.tn{position:relative;margin-bottom:6px}
.tn::before{content:"";position:absolute;left:-26px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--c,var(--next));box-shadow:0 0 0 4px var(--bg)}
.tn.now::before{box-shadow:0 0 0 4px var(--bg),0 0 14px var(--now)}
.tr{margin:0 0 6px;font-family:"JetBrains Mono",monospace;color:var(--mut);font-size:.72rem;padding-left:2px;position:relative;top:-2px}
.ev{display:flex;gap:8px;align-items:baseline;font-size:.84rem;margin-top:6px}
.ev .tag{flex:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:.62rem;text-align:center;color:var(--mut);font-family:"JetBrains Mono",monospace;letter-spacing:.08em}
.cd{aspect-ratio:1;border-radius:9px;background:var(--bg2);border:1px solid transparent;font-size:.78rem;position:relative;padding:4px 5px;cursor:pointer;color:var(--tx);text-align:left;font-family:"JetBrains Mono",monospace}
.cd.st{background:color-mix(in srgb,var(--c) 26%,var(--bg2));border-color:color-mix(in srgb,var(--c) 55%,transparent)}
.cd.today{outline:2px solid var(--acc)}.cd.sel{box-shadow:0 0 0 2px var(--tx)}.cd.out{opacity:.25}
.cd .m{position:absolute;right:4px;bottom:4px;display:flex;gap:3px}.cd .m i{width:6px;height:6px;border-radius:50%;background:var(--now)}.cd .m i.a{background:var(--acc)}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ph figure{margin:0;position:relative;border-radius:12px;overflow:hidden;aspect-ratio:1;background:var(--bg2);border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;display:block}
.ph figcaption{position:absolute;left:0;right:0;bottom:0;padding:20px 8px 6px;font-size:.72rem;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;pointer-events:none}
.ph .x{position:absolute;top:6px;right:6px;border:0;border-radius:8px;background:rgba(0,0,0,.6);color:#fff;padding:2px 8px}
.lb{position:fixed;inset:0;background:rgba(2,6,10,.92);z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:10px;cursor:zoom-out}
.lb img{max-width:100%;max-height:82vh;border-radius:10px}.lb p{color:#cfe3f3;margin:0}
.place{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.place:last-child{border-bottom:0}
.place .t{flex:1;min-width:0}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><i></i><div><b>Cancún → Buenos Aires</b><small>Latinská Amerika</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot mono" id="foot"></div>
  </aside>

{k:"Mexiko",f:"🇲🇽",m:"peso (MXN) · 127 V, zásuvky A/B",
h:"Nejstarší vyspělou kulturou byli Olmékové (kolem 1200–400 př. n. l.) na pobřeží Mexického zálivu. Po nich vzkvétalo Teotihuacán, největší město předkolumbovské Ameriky, a mayská města na Yucatánu (Chichén Itzá, Uxmal, Palenque). Aztékové založili kolem 1325 Tenochtitlán na ostrově v jezeře Texcoco a vybudovali říši s miliony poddaných. Hernán Cortés přistál 1519 a díky spojenectví s domorodými rivaly a epidemii neštovic dobyl Tenochtitlán 1521. Následovaly tři století Nového Španělska. Povstání zahájil kněz Miguel Hidalgo výzvou „Grito de Dolores“ (16. 9. 1810), samostatnost přišla 1821. Mexiko pak ztratilo Texas (1836) a ve válce s USA (1846–48) i Kalifornii a Nové Mexiko, zažilo francouzskou intervenci a císaře Maxmiliána (1864–67, popraven) i diktaturu Porfiria Díaze. Revoluce (1910–1920; Zapata, Pancho Villa) vedla k ústavě 1917 a k vládě strany PRI, která trvala do roku 2000.",

{k:"Guatemala",f:"🇬🇹",m:"quetzal (GTQ) · 120 V, zásuvky A/B",
h:"Mayové zde budovali města už od zhruba 1000 př. n. l. V předklasické době stála obří pyramida La Danta v El Miradoru, v klasickém období (250–900 n. l.) vrcholil Tikal. Kolem roku 900 se městské státy v nížinách zhroutily (sucho, války), mayská vysočina ale přežila. Pedro de Alvarado dobyl zemi 1523–24 se spojenci z řad Tlaxcalteků a Kakchikelů a porazil K'iche' (legenda o Tecún Umánovi). Kapitánie Guatemala pak spravovala celou Střední Ameriku od Chiapasu po Kostariku. Hlavním městem byla Antigua, dokud ji 1773 nezničilo zemětřesení (hlavní město se přesunulo do dnešního Guatemala City). Nezávislost 1821, krátké připojení k Mexiku a Federace Střední Ameriky (1823–41). Převrat 1954 podporovaný CIA svrhl prezidenta Árbenze, který chtěl pozemkovou reformu na úkor United Fruit Company, a otevřel cestu k občanské válce 1960–1996. Zahynulo přes 200 000 lidí, většinou mayských civilistů. V 80. letech za Ríose Montta šlo o genocidu domorodců. Rigoberta Menchú za svědectví získala 1992 Nobelovu cenu míru.",
top:["Antigua Guatemala (UNESCO) a noční výstup na Acatenango (výhled na erupce Fuego)","Jezero Atitlán a vesnice kolem (San Pedro, San Marcos, Panajachel)","Tikal v džungli a Flores","Semuc Champey, Lanquín","Quetzaltenango (Xela), trh Chichicastenango"],

tips:["Turistické shuttly (Antigua–Atitlán–Flores) jsou bezpečnější než „chicken busy“","Hotovost v quetzalech, bankomaty raději uvnitř bank nebo obchodních center","Na Acatenango teplé oblečení – nahoře mrzne","Nocleh u Tikalu rezervuj dopředu o víkendech","Kolem Fuego občas uzavírky – sleduj aktuální stav sopky"],

{k:"Salvador",f:"🇸🇻",m:"americký dolar (USD) · 115 V, zásuvky A/B",
h:"Zemi obývali Pipilové (nahuatlsky mluvící národ; jméno Cuzcatlán znamená země drahokamů) a Lencové. Ve vesnici Joya de Cerén se dochovalo mayské sídlo zasypané sopečným popelem kolem roku 600, často nazývané americké Pompeje. Alvarado vstoupil do Cuzcatlánu 1524, podrobení země trvalo do 1540. Kolonii proslavilo indigo a později káva. Nezávislost 1821, po rozpadu Federace Střední Ameriky 1841 samostatná republika. Moc držela hrstka rodin pěstitelů kávy. Povstání rolníků 1932 armáda potlačila masakrem (La Matanza, desítky tisíc mrtvých). Fotbalová válka s Hondurasem 1969 trvala asi 100 hodin. Občanská válka 1980–1992 (zhruba 75 000 obětí) mezi vojenskou vládou a levicovým hnutím FMLN: 1980 byl zavražděn arcibiskup Óscar Romero, 1981 došlo k masakru v El Mozote. Mír 1992. Deportace členů losangeleských gangů z USA vedly ke vzniku MS-13 a Barrio 18; od 2022 platí výjimečný stav prezidenta Nayiba Bukeleho.",

{k:"Nikaragua",f:"🇳🇮",m:"córdoba (NIO), USD běžně · 120 V, zásuvky A/B",
h:"Před Španěly tu žili Nicarao (Nahuové, odtud jméno země) a Chorotegové; otisky chodidel z Acahualinca jsou staré přes 2 000 let. Španělé založili 1524 Granadu a León a Granadu pak opakovaně plenili piráti připlouvající z Karibiku. Nezávislost 1821. Americký dobrodruh William Walker se 1855 prohlásil prezidentem, obnovil otroctví a 1857 ho vyhnala koalice středoamerických států v čele s Kostarikou. V letech 1912–1933 zemi okupovala americká námořní pěchota; partyzán Augusto Sandino proti ní bojoval a 1934 byl zavražděn. Následovala dynastie Somozů (1936–1979), svržená sandinistickou revolucí. V 80. letech vedla vláda FSLN válku s Contras financovanými USA (aféra Írán–Contra), Daniel Ortega byl prezidentem 1985–1990. Po návratu k moci 2007 postupně upevnil vládu a po protestech 2018 (stovky mrtvých) potlačil opozici, nezávislá média a řadu občanských organizací.",

{k:"Kostarika",f:"🇨🇷",m:"colón (CRC), USD přijímán · 120 V, zásuvky A/B",
h:"Před Španěly zde nebyly velké říše, žily menší kmeny (Chorotegové, Huetarové, Bribri). Záhadou zůstávají kamenné koule kultury Diquís (UNESCO). Kolumbus doplul k pobřeží 1502 a pojmenoval zemi Bohaté pobřeží, ale zlata bylo málo a domorodá populace rychle klesla. Kolonie patřila k nejchudším v kapitánii Guatemala a kolonisté se živili prací na malých farmách, proto vznikla rovnostářštější společnost než jinde. V letech 1856–57 porazila armáda vedená Juanem Rafaelem Morou filibustera Williama Walkera (hrdina Juan Santamaría). Od 80. let 19. století rostla káva a banány (United Fruit, železnice ke Karibiku). Po krátké občanské válce 1948 José Figueres zrušil armádu (ústava 1949), zavedl volební právo žen i černošského obyvatelstva a peníze šly do školství a zdravotnictví. Óscar Arias získal 1987 Nobelovu cenu míru za mírový plán pro Střední Ameriku.",

{k:"Panama",f:"🇵🇦",m:"americký dolar (USD) · 120 V, zásuvky A/B",
h:"Vasco Núñez de Balboa překročil šíji 1513 a jako první Evropan spatřil Tichý oceán. Panama City (1519) se stalo výchozím bodem pro vývoz peruánského stříbra přes šíji do Portobela. Piráti, Drake i Henry Morgan, pevnosti a města plenili; Morgan 1671 vypálil první Panama City (Panamá Viejo). Panama patřila ke Kolumbii a 1821 se k ní připojila dobrovolně. Francouzi pod Ferdinandem de Lesseps, stavitelem Suezu, začali kanál 1881, ale kvůli žluté zimnici a malárii zahynulo asi 22 000 dělníků a projekt padl. USA převzaly stavbu, podpořily separatistické povstání a Panama se 3. 11. 1903 oddělila od Kolumbie. USA získaly pásmo průplavu, kanál byl otevřen 1914 (při stavbě zahynulo dalších asi 5 600 lidí). Nepokoje 1964 a smlouva Torrijos–Carter z roku 1977 vedly k předání kanálu Panamě 31. 12. 1999. Invaze USA 1989 svrhla generála Noriegu.",

{k:"Kolumbie",f:"🇨🇴",m:"peso (COP) · 110 V, zásuvky A/B",
h:"Na náhorní plošině kolem Bogoty žili Muiscové; obřad s pozlaceným náčelníkem v jezeře Guatavita dal vzniknout legendě o El Doradu. Na severu žili Tairona (Ciudad Perdida). Španělé založili Santa Martu 1525 a Cartagenu 1533, Gonzalo Jiménez de Quesada dobyl Muisky a 1538 založil Bogotu. Cartagena byla hlavním přístavem pro zlato a otroky a odolala útokům Drakea i admirála Vernona (1741). Simón Bolívar rozhodl o nezávislosti bitvou u Boyacá 1819 a vznikla Velká Kolumbie (dnešní Kolumbie, Venezuela, Ekvádor, Panama), která se rozpadla 1830. Následovaly občanské války liberálů a konzervativců včetně Války tisíce dnů (1899–1902) a ztráty Panamy 1903. Zavraždění Jorgeho Gaitána 1948 odstartovalo La Violencia (asi 200 000 mrtvých). Od 60. let bojovali partyzáni (FARC, ELN), v 80.–90. letech vládly kartely (Pablo Escobar, †1993). Mírová dohoda s FARC 2016 přinesla Nobelovu cenu míru prezidentu Santosovi, ale násilí v některých regionech trvá.",

{k:"Peru",f:"🇵🇪",m:"sol (PEN) · 220 V, zásuvky A/B/C",
h:"Nejstarší civilizace Ameriky, Caral (kolem 3000 př. n. l.), stála severně od Limy. Po ní následovaly Chavín, Paracas, Nazca (linie v poušti), Moche a Wari. Inkové vyrostli z Cusca na říši Tawantinsuyu: od 1438 za Pachacutekem ovládli území od dnešní Kolumbie po Chile s cestní sítí Qhapaq Ñan a záznamy vedli uzlovým písmem kipu. Po občanské válce bratrů Huáscara a Atahualpy a epidemii neštovic přistál 1532 Francisco Pizarro s asi 170 muži, v Cajamarce zajal Atahualpu, vzal výkupné (místnost plnou zlata) a 1533 ho popravil. Cusco padlo 1533, Lima (1535) se stala centrem místokrálovství. Inkové vedli odboj z Vilcabamby do roku 1572. Nezávislost vyhlásil San Martín 1821, definitivně rozhodla bitva u Ayacucha 1824. Ve Válce o Pacifik (1879–83) Peru prohrálo s Chile. V letech 1980–2000 sužovala zemi Světlá stezka (asi 70 000 obětí). Machu Picchu zpřístupnil světu 1911 Hiram Bingham.",

{k:"Bolívie",f:"🇧🇴",m:"boliviano (BOB) · 230 V, zásuvky A/C",
h:"Altiplano bylo kolébkou Tiwanaku (zhruba 500–1000 n. l.), významného centra u jezera Titicaca. Poté tu vládli Aymarové a od 15. století Inkové. Roku 1545 objevili Španělé obří stříbrné ložisko v Cerro Rico u Potosí. Město vyrostlo mezi největší na světě (kolem 1650 asi 160 000 lidí) a stříbro financovalo Španělsko. Těžili domorodí dělníci v nuceném systému mita a později dovezení otroci, zemřely statisíce lidí. Povstání Túpaca Katariho oblehlo 1781 La Paz. Nezávislost 1825, jméno země podle Bolívara a prvním prezidentem byl Sucre. Bolívie pak ztratila velká území: ve Válce o Pacifik (1879–83) pobřeží s Atacamou Chile, 1903 Acre Brazílii a ve válce o Chaco (1932–35) velkou část Chaca Paraguayi. Revoluce 1952 znárodnila doly a zavedla všeobecné volební právo. Che Guevara zde 1967 zahynul. Vojenské vlády skončily 1982. Evo Morales, první domorodý prezident (2006–2019), přejmenoval zemi na Plurinárodní stát (ústava 2009). Země dodnes usiluje o přístup k moři.",

{k:"Chile",f:"🇨🇱",m:"peso (CLP) · 220 V, zásuvky C/L",
h:"Na jihu žili Mapučové (Araukáni), které nepodrobili ani Inkové a dlouho ani Španělé. Pedro de Valdivia založil Santiago 1541, ale válka v Arauco trvala přes 300 let. Chile bylo okrajovou kolonií. První junta vznikla 1810, nezávislost vyhlásil 1818 Bernardo O'Higgins po vítězstvích armády San Martína u Chacabuca a Maipú. Ve 19. století nastoupila stabilní oligarchická republika. Válka o Pacifik (1879–83) s Peru a Bolívií dala Chile ložiska ledku v Atacamě a zvětšila území, Bolívie přišla o moře. Později rostl význam mědi. V roce 1970 byl zvolen socialista Salvador Allende, 11. 9. 1973 ho svrhl vojenský převrat generála Augusta Pinocheta (bombardování paláce La Moneda). Diktatura do 1990 měla tisíce zavražděných a zmizelých a desítky tisíc mučených, ekonomické reformy provedli Chicago boys. Referendum 1988 ukončilo Pinochetovu vládu. V roce 2010 se podařilo zachránit 33 horníků z Copiapó. Protesty 2019 vedly k pokusům o novou ústavu, oba návrhy (2022, 2023) ale voliči odmítli.",

{k:"Argentina",f:"🇦🇷",m:"peso (ARS) · 220 V, zásuvky C/I",
h:"Před Španěly žili na severozápadě Diaguité (spojení s Inky), na pampách Querandí a na jihu Tehuelčové. Pedro de Mendoza založil Buenos Aires 1536, domorodci ho vyhnali a Juan de Garay ho 1580 založil znovu. Do 1776 patřila oblast k místokrálovství Peru, pak vzniklo místokrálovství Río de la Plata s Buenos Aires. Po Květnové revoluci 1810 vyhlásil Kongres v Tucumánu 9. 7. 1816 nezávislost a José de San Martín vedl armádu přes Andy do Chile a Peru. Následovaly občanské války unitářů a federalistů, vláda Rosase a ústava 1853. Takzvané dobytí pouště (1870.–1880.) vyhubilo domorodé národy v pampách a Patagonii. Do 1914 přišlo asi 6 milionů přistěhovalců (Itálie, Španělsko) a Argentina patřila k nejbohatším zemím světa. Juan Perón a Evita (od 1946) založili peronismus, vojenské převraty přišly 1930, 1955, 1966 a 1976. Poslední junta (1976–83) vedla špinavou válku, odhadem 30 000 zmizelých (desaparecidos), Matky z Plaza de Mayo. Porážka ve Falklandské válce 1982 ji svrhla. Demokracie se vrátila 1983, krize 2001 přinesla státní bankrot a od prosince 2023 vládne Javier Milei.",

{k:"Paraguay",f:"🇵🇾",m:"guaraní (PYG) · 220 V, zásuvka C",
h:"Domovem byli Guaraníové. Španělé založili Asunción 1537 a smíšení se Španěly vytvořilo mestickou kulturu: guaraní je dnes s španělštinou úředním jazykem a mluví jím většina lidí. V 17.–18. století vybudovali jezuité redukce, autonomní vesnice Guaraníů s hudbou, školami a řemesly (Trinidad, Jesús; film Mise); 1767 byli vypovězeni. Nezávislost 1811 přišla bez boje, José Gaspar Rodríguez de Francia (1814–1840) zemi izoloval. Válka Trojspolku (1864–1870) proti Argentině, Brazílii a Uruguayi pod Francisco Solano Lópezem byla nejkrvavější válkou Jižní Ameriky. Odhady ztrát se liší, ale zemřela obrovská část obyvatel, hlavně mužů, a Paraguay přišlo o velká území. Válka o Chaco s Bolívií (1932–35) skončila paraguayským vítězstvím. Generál Alfredo Stroessner vládl 1954–1989 jednu z nejdelších diktatur regionu. Po jeho pádu přišla demokratizace, ale strana Colorado ovládá politiku od 1947 až na krátké přerušení.",

{k:"Uruguay",f:"🇺🇾",m:"peso (UYU) · 230 V, zásuvky C/F/L",
h:"Domorodí Charrúové odolávali Španělům a Portugalcům, kteří se o území přetahovali. Portugalci založili Colonii del Sacramento 1680, Španělé Montevideo 1724–26 jako pevnost. Národní hrdina José Gervasio Artigas vedl od 1811 povstání proti Španělům a prosazoval radikální pozemkovou reformu. Po obsazení Brazílií a povstání Třiatřiceti orientálů (1825) zprostředkovala Británie 1828 vznik nárazníkového státu mezi Argentinou a Brazílií. V letech 1839–1851 trvala Velká válka mezi stranami Colorados a Blancos (existují dodnes). Na počátku 20. století prezident José Batlle y Ordóñez zavedl osmihodinový pracovní den, rozvod, penze a oddělení církve od státu, země se přezdívala Švýcarsko Jižní Ameriky. Roku 1930 Uruguay uspořádala a vyhrála první mistrovství světa ve fotbale. Partyzáni Tupamaros a převrat 1973 vedly k diktatuře do 1985. Od návratu demokracie je země stabilní, 2013 legalizovala marihuanu i sňatky osob stejného pohlaví.",

const b64=s=>btoa(unescape(encodeURIComponent(s)));
async function ghWrite(repo,file,obj,msg){
  const H={Authorization:'Bearer '+TOKEN,Accept:'application/vnd.github+json'};
  const body=JSON.stringify(obj,null,1);
  for(let t=0;t<2;t++){
    let sha;
    const g=await fetch(apiU(repo,file)+'?t='+Date.now(),{headers:H,cache:'no-store'});
    if(g.ok)sha=(await g.json()).sha;else if(g.status!==404)throw new Error('čtení '+g.status);

    if(p.ok)return;

  }
  throw new Error('konflikt');
}

const PHL={};
function resizeImg(file,max=1400,q=.78){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');
      c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      let d=c.toDataURL('image/jpeg',q);
      if(d.length>1.4e6)d=c.toDataURL('image/jpeg',.6);
      res(d);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('obrázek'))};
    img.src=url;
  });
}

/* ================= GEOMETRIE MAPY ================= */
const W0=516,H0=534;
const X=lon=>(lon+118)*6,Y=lat=>(33-lat)*6;
const pts=a=>a.map(p=>X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join(" ");
function ptIn(r,lon,lat){let c=false;for(let i=0,j=r.length-2;i<r.length;j=i,i+=2){const xi=r[i],yi=r[i+1],xj=r[j],yj=r[j+1];if((yi>lat)!==(yj>lat)&&lon<(xj-xi)*(lat-yi)/(yj-yi)+xi)c=!c}return c}
function segD(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(ax+t*dx-px,ay+t*dy-py)}
function countryAt(lon,lat){
  for(let g=0;g<GEO.length;g++)for(const r of GEO[g].r)if(ptIn(r,lon,lat))return g;
  let best=-1,bd=1.5;
  GEO.forEach((G,g)=>G.r.forEach(r=>{for(let i=0,j=r.length-2;i<r.length;j=i,i+=2){const d=segD(lon,lat,r[j],r[j+1],r[i],r[i+1]);if(d<bd){bd=d;best=g}}}));
  return best;
}
const CC=new Map();
function ctryIdx(s){const k=s.lat+','+s.lon;if(!CC.has(k))CC.set(k,countryAt(s.lon,s.lat));return CC.get(k)}
const km=(a,b)=>{const t=x=>x*Math.PI/180,dl=t(b.lat-a.lat),dn=t(b.lon-a.lon),q=Math.sin(dl/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dn/2)**2;return 2*6371*Math.asin(Math.sqrt(q))};
function routeKm(){let tot=0,done=0;const ci=curIdx();for(let i=1;i<S.stops.length;i++){const d=km(S.stops[i-1],S.stops[i]);tot+=d;if(i<=ci)done+=d}return{tot,done}}
const col=i=>i<curIdx()?'var(--done)':i===curIdx()?'var(--now)':'var(--next)';
const curCountry=()=>curStop().c;

/* ================= STAV ZEMÍ NA MAPĚ ================= */
function ctryStatus(){
  const ci=curIdx(),st={};
  S.stops.forEach((p,i)=>{const g=ctryIdx(p);if(g<0)return;const k=i===ci?'now':i<ci?'done':'plan';
    if(k==='now'||(k==='done'&&st[g]!=='now')||(k==='plan'&&!st[g]))st[g]=k});
  return st;
}

/* ================= 3D GLÓBUS ================= */
const D=Math.PI/180;
const G={lon:-75,lat:-8,drag:null,auto:true,raf:0,resume:0,col:null};
function globeColors(){
  const s=getComputedStyle(document.documentElement),g=n=>s.getPropertyValue(n).trim()||'#888';
  G.col={sea:g('--sea'),land:g('--land'),landS:g('--land-s'),acc:g('--acc'),now:g('--now'),done:g('--done'),next:g('--next'),tx:g('--tx'),p2:g('--panel2')};
}
function globeInit(){
  const cv=$('globe');if(!cv)return;
  cv.addEventListener('pointerdown',e=>{G.drag={x:e.clientX,y:e.clientY,lon:G.lon,lat:G.lat};G.auto=false;try{cv.setPointerCapture(e.pointerId)}catch(_){}});
  cv.addEventListener('pointermove',e=>{if(!G.drag)return;G.lon=G.drag.lon-(e.clientX-G.drag.x)*.35;G.lat=Math.max(-70,Math.min(70,G.drag.lat+(e.clientY-G.drag.y)*.35))});
  const up=()=>{G.drag=null;clearTimeout(G.resume);G.resume=setTimeout(()=>{G.auto=true},4000)};
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
}
function globeStart(){globeColors();if(!G.raf)G.raf=requestAnimationFrame(globeFrame)}
function globeFrame(ts){G.raf=0;if(view!=='home'||!$('globe'))return;drawGlobe(ts);G.raf=requestAnimationFrame(globeFrame)}
const vec=(lon,lat)=>[Math.cos(lat*D)*Math.cos(lon*D),Math.cos(lat*D)*Math.sin(lon*D),Math.sin(lat*D)];
function gcPts(a,b,n){
  const va=vec(a.lon,a.lat),vb=vec(b.lon,b.lat),dot=Math.max(-1,Math.min(1,va[0]*vb[0]+va[1]*vb[1]+va[2]*vb[2])),om=Math.acos(dot),so=Math.sin(om)||1,out=[];
  for(let k=0;k<=n;k++){const t=k/n,f1=Math.sin((1-t)*om)/so,f2=Math.sin(t*om)/so,v=[f1*va[0]+f2*vb[0],f1*va[1]+f2*vb[1],f1*va[2]+f2*vb[2]];out.push({lat:Math.asin(Math.max(-1,Math.min(1,v[2])))/D,lon:Math.atan2(v[1],v[0])/D,t,om})}
  return out;
}
function drawGlobe(ts){
  const cv=$('globe'),ctx=cv&&cv.getContext&&cv.getContext('2d');if(!ctx||!G.col)return;
  const C=G.col,dpr=Math.min(2,window.devicePixelRatio||1),w=cv.clientWidth||360;
  if(cv.width!==Math.round(w*dpr))cv.width=cv.height=Math.round(w*dpr);
  const N=cv.width,R=N*.42,cx=N/2,cy=N/2,cur=curStop(),ci=curIdx();
  if(G.auto&&!G.drag){G.lon+=((cur.lon+Math.sin(ts/4500)*16)-G.lon)*.02;G.lat+=((Math.max(-30,Math.min(20,cur.lat*.6)))-G.lat)*.02}
  const l0=G.lon*D,p0=G.lat*D,sp0=Math.sin(p0),cp0=Math.cos(p0);
  const P3=(lon,lat,rr=1)=>{const l=lon*D-l0,p=lat*D,sp=Math.sin(p),cp=Math.cos(p),cl=Math.cos(l);return{x:cx+cp*Math.sin(l)*R*rr,y:cy-(cp0*sp-sp0*cp*cl)*R*rr,c:sp0*sp+cp0*cp*cl}};
  ctx.clearRect(0,0,N,N);
  let g=ctx.createRadialGradient(cx,cy,R*.92,cx,cy,R*1.28);g.addColorStop(0,'rgba(61,220,255,.28)');g.addColorStop(1,'rgba(61,220,255,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R*1.28,0,7);ctx.fill();
  g=ctx.createRadialGradient(cx-R*.35,cy-R*.4,R*.1,cx,cy,R);g.addColorStop(0,C.p2);g.addColorStop(1,C.sea);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.fill();
  ctx.save();ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.clip();
  /* souřadnicová síť */
  ctx.strokeStyle='rgba(140,170,200,.13)';ctx.lineWidth=1;
  const ln=(f)=>{ctx.beginPath();let pen=false;for(let k=0;k<=72;k++){const q=f(k/72),p=P3(q[0],q[1]);if(p.c>0){pen?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y);pen=true}else pen=false}ctx.stroke()};
  for(let la=-60;la<=60;la+=20)ln(t=>[-180+360*t,la]);
  for(let lo=-180;lo<180;lo+=20)ln(t=>[lo,-80+160*t]);
  /* země */
  const st=ctryStatus();
  GEO.forEach((c,gi)=>{
    if(c.n==='USA'||c.n==='Falklandy')return;
    ctx.beginPath();let vis=false;
    c.r.forEach(r=>{for(let i=0;i<r.length;i+=2){let p=P3(r[i],r[i+1]);if(p.c>0)vis=true;else{let dx=p.x-cx,dy=p.y-cy,len=Math.hypot(dx,dy)||1;p={x:cx+dx/len*R,y:cy+dy/len*R}}i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)}ctx.closePath()});
    if(!vis)return;
    ctx.fillStyle=C.land;ctx.fill();
    const s=st[gi];if(s){ctx.globalAlpha=s==='now'?.5:s==='done'?.4:.2;ctx.fillStyle=s==='now'?C.now:s==='done'?C.done:C.acc;ctx.fill();ctx.globalAlpha=1}
    ctx.strokeStyle=C.landS;ctx.lineWidth=.8*dpr;ctx.stroke();
  });
  /* trasa (velké kruhy), animace */
  const stops=S.stops;
  for(let i=1;i<stops.length;i++){
    const pts=gcPts(stops[i-1],stops[i],28),done=i<=ci;
    ctx.beginPath();let pen=false;
    pts.forEach(q=>{const p=P3(q.lon,q.lat,1+Math.sin(Math.PI*q.t)*Math.min(.1,q.om*.1));if(p.c>0.02){pen?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y);pen=true}else pen=false});
    if(done){ctx.strokeStyle=C.acc;ctx.lineWidth=2.4*dpr;ctx.shadowColor=C.acc;ctx.shadowBlur=10*dpr;ctx.setLineDash([])}
    else{ctx.strokeStyle=C.next;ctx.lineWidth=1.6*dpr;ctx.shadowBlur=0;ctx.setLineDash([4*dpr,5*dpr]);ctx.lineDashOffset=-ts/60}
    ctx.stroke();ctx.shadowBlur=0;ctx.setLineDash([]);
  }
  if(ci>0){
    const pts=gcPts(stops[ci-1],stops[ci],60),t=(ts/2800)%1,q=pts[Math.min(60,Math.floor(t*60))],p=P3(q.lon,q.lat,1+Math.sin(Math.PI*q.t)*Math.min(.1,q.om*.1));
    if(p.c>0.02){ctx.fillStyle='#fff';ctx.shadowColor=C.acc;ctx.shadowBlur=16*dpr;ctx.beginPath();ctx.arc(p.x,p.y,3.2*dpr,0,7);ctx.fill();ctx.shadowBlur=0}
  }
  stops.forEach((s,i)=>{
    const p=P3(s.lon,s.lat);if(p.c<0.03)return;
    const col=i<ci?C.done:i===ci?C.now:C.next;
    ctx.fillStyle=col;ctx.beginPath();ctx.arc(p.x,p.y,(i===ci?4.5:3)*dpr,0,7);ctx.fill();
    if(i===ci){
      ctx.strokeStyle=C.now;ctx.globalAlpha=.55;ctx.lineWidth=1.6*dpr;ctx.beginPath();ctx.arc(p.x,p.y,(9+4*Math.sin(ts/300))*dpr,0,7);ctx.stroke();ctx.globalAlpha=1;
      ctx.font=`600 ${11*dpr}px "JetBrains Mono",monospace`;ctx.fillStyle=C.tx;ctx.textAlign='left';ctx.fillText(s.n.toUpperCase(),p.x+13*dpr,p.y-10*dpr);
    }
  });
  ctx.restore();
  ctx.strokeStyle='rgba(61,220,255,.4)';ctx.lineWidth=1.4*dpr;ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.stroke();
}

/* ================= GRAFY ================= */
const czkS=n=>n>=1e6?(n/1e6).toFixed(1).replace('.',',')+' M':n>=1e4?Math.round(n/1e3)+' tis.':Math.round(n).toLocaleString('cs-CZ');
function combo({labels,sub,max,min,rain,rainMax}){
  const W=560,H=246,pl=36,pr=12,pt=16,pb=42,iw=W-pl-pr,ih=H-pt-pb,n=labels.length;
  const lo=Math.floor((Math.min(...min)-2)/5)*5,hi=Math.ceil((Math.max(...max)+2)/5)*5,rm=rainMax||Math.max(10,...rain);
  const x=i=>pl+iw*(i+.5)/n,y=t=>pt+ih*(1-(t-lo)/(hi-lo));
  let s=`<svg class="ch" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Graf teplot a srážek">`;
  for(let t=lo;t<=hi;t+=5)s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(t)+3}" text-anchor="end">${t}°</text>`;
  rain.forEach((r,i)=>{const h=Math.max(0,r/rm)*ih*.38;s+=`<rect x="${x(i)-iw/n*.22}" y="${pt+ih-h}" width="${iw/n*.44}" height="${h}" rx="3" fill="var(--acc)" opacity=".3"/>`});
  const path=a=>a.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join('');
  s+=`<path d="${path(max)}" fill="none" stroke="var(--now)" stroke-width="2.2" stroke-linejoin="round"/><path d="${path(min)}" fill="none" stroke="var(--acc)" stroke-width="2.2" stroke-linejoin="round"/>`;
  max.forEach((v,i)=>s+=`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="var(--now)"/><text x="${x(i)}" y="${y(v)-8}" text-anchor="middle" style="fill:var(--tx)">${Math.round(v)}°</text>`);
  min.forEach((v,i)=>s+=`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="var(--acc)"/><text x="${x(i)}" y="${y(v)+15}" text-anchor="middle">${Math.round(v)}°</text>`);
  labels.forEach((l,i)=>s+=`<text x="${x(i)}" y="${H-24}" text-anchor="middle" style="fill:var(--tx)">${esc(l)}</text><text x="${x(i)}" y="${H-10}" text-anchor="middle">${esc(sub[i])}</text>`);
  return s+'</svg><div class="legendc"><span><i class="dot" style="background:var(--now)"></i>max °C</span><span><i class="dot" style="background:var(--acc)"></i>min °C</span><span><i class="dot" style="background:var(--acc);opacity:.4"></i>srážky (mm)</span></div>';
}
function donut(data,total){
  const R=52,Cc=2*Math.PI*R;let off=0;
  let s=`<svg class="ch" viewBox="0 0 140 140" width="150" height="150" role="img" aria-label="Výdaje podle kategorií"><circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--line)" stroke-width="16"/>`;
  data.forEach(([l,v],i)=>{const len=Cc*v/total;s+=`<circle cx="70" cy="70" r="${R}" fill="none" stroke="${PAL[i%PAL.length]}" stroke-width="16" stroke-dasharray="${len} ${Cc-len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=len});
  return s+`<text x="70" y="68" text-anchor="middle" style="fill:var(--tx);font-size:12px;font-weight:700">${czkS(total)}</text><text x="70" y="82" text-anchor="middle">Kč celkem</text></svg>`;
}
function areaChart(points,limit){
  const W=560,H=200,pl=44,pr=12,pt=14,pb=26,iw=W-pl-pr,ih=H-pt-pb,n=points.length;
  const mx=Math.max(limit||0,...points.map(p=>p[1]),1),x=i=>pl+(n===1?iw/2:iw*i/(n-1)),y=v=>pt+ih*(1-v/mx);
  let s=`<svg class="ch" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Kumulativní výdaje"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--acc)" stop-opacity=".35"/><stop offset="1" stop-color="var(--acc)" stop-opacity="0"/></linearGradient></defs>`;
  for(let k=0;k<=4;k++){const v=mx*k/4;s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+3}" text-anchor="end">${czkS(v)}</text>`}
  if(limit)s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(limit)}" y2="${y(limit)}" stroke="var(--now)" stroke-dasharray="5 4"/><text x="${W-pr}" y="${y(limit)-5}" text-anchor="end" style="fill:var(--now)">limit</text>`;
  const d=points.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p[1]).toFixed(1)).join('');
  s+=`<path d="${d}L${x(n-1)} ${y(0)}L${x(0)} ${y(0)}Z" fill="url(#ag)"/><path d="${d}" fill="none" stroke="var(--acc)" stroke-width="2.4" stroke-linejoin="round"/>`;
  points.forEach((p,i)=>{s+=`<circle cx="${x(i)}" cy="${y(p[1])}" r="3" fill="var(--acc)"/>`;if(i===0||i===n-1||n<=6)s+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${esc(fdm(p[0]))}</text>`});

}

/* ================= RAZÍTKA ZEMÍ ================= */
function stampsHtml(){
  const ci=curIdx(),order=[],seen={};
  S.stops.forEach((s,i)=>{if(!s.c)return;if(!seen[s.c]){seen[s.c]={c:s.c,first:i,date:s.a||''};order.push(seen[s.c])}else if(!seen[s.c].date&&s.a)seen[s.c].date=s.a});
  const curC=S.stops[ci].c;
  return `<div class="stamps">${order.map((o,n)=>{
    const k=o.c===curC?'now':o.first<=ci?'done':'plan';
    return `<div class="stamp ${k}" style="--r:${(n*37)%9-4}deg">${flag(o.c,40)}<b>${esc(o.c)}</b><small>${k==='now'?'TEĎ TADY':k==='done'?(o.date?fd(o.date):'NAVŠTÍVENO'):(o.date?fd(o.date):'V PLÁNU')}</small></div>`}).join('')}</div>`;
}

/* ================= SVÁTKY A FESTIVALY ================= */
const eventsIn=(country,from,to)=>EVENTS.filter(e=>e.c===country&&e.from<=to&&e.to>=from);
const evRange=e=>e.from===e.to?fdm(e.from):fdm(e.from)+' – '+fdm(e.to);
function tripEvents(){
  const out=[];
  S.stops.forEach(s=>{if(!s.a)return;eventsIn(s.c,addDays(s.a,-1),addDays(s.o||s.a,1)).forEach(e=>out.push({e,s}))});
  return out.sort((a,b)=>a.e.from.localeCompare(b.e.from));
}
function nextEvents(n=4){
  const t=todayISO(),dated=tripEvents().filter(x=>x.e.to>=t);
  if(dated.length)return dated.slice(0,n);
  const cs=[...new Set(S.stops.slice(curIdx()).map(s=>s.c))].slice(0,2),lim=addDays(t,60);
  return EVENTS.filter(e=>cs.includes(e.c)&&e.to>=t&&e.from<=lim).sort((a,b)=>a.from.localeCompare(b.from)).slice(0,n).map(e=>({e,s:null}));
}
const evHtml=({e,s})=>`<div class="ev"><span class="tag ${e.t==='f'?'ok':''}">${e.t==='f'?'FESTIVAL':'SVÁTEK'}</span><span><b>${esc(e.n)}</b> <span style="color:var(--mut)">· ${evRange(e)} · ${esc(e.c)}${s?' · '+esc(s.n):''}${e.note?' · '+esc(e.note):''}</span></span></div>`;

/* ================= ČASOVÁ OSA A KALENDÁŘ ================= */
let oTab='osa',calM=null,calSel=null;
const pad2=n=>String(n).padStart(2,'0');
function stopOnDay(iso){
  let best=null;
  S.stops.forEach(s=>{if(!s.a)return;if(s.a<=iso&&iso<=(s.o||s.a)&&(!best||s.a>=best.a))best=s});
  return best;
}
function vOsa(){
  if(!calM){const t=todayISO(),fs=S.stops.find(s=>s.a);calM=(fs&&(t<fs.a||!stopOnDay(t))?fs.a:t).slice(0,7)}
  $('v-osa').innerHTML=pageHead('Časová osa','Dny, přesuny a události na cestě')+seg([['osa','Osa'],['kal','Kalendář']],oTab,'otab')+(oTab==='kal'?calHtml():tlHtml());
}
function tlHtml(){
  const ci=curIdx();

    const c=i<ci?'var(--done)':i===ci?'var(--now)':'var(--next)',nights=s.a&&s.o?diffDays(s.a,s.o):null;
    const evs=s.a?eventsIn(s.c,addDays(s.a,-1),addDays(s.o||s.a,1)):[];

    return tr+`<div class="tn ${i===ci?'now':''}" style="--c:${c}"><div class="card"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><div class="row" style="gap:10px;flex-wrap:nowrap">${flag(s.c,34)}<div><b style="font-size:1.05rem">${esc(s.n)}${i===ci?'<span class="here">TEĎ</span>':''}</b><div class="lab">${esc(s.c)} · ${s.a?esc(fd(s.a))+(s.o?' → '+esc(fd(s.o)):''):'termín neurčen'}${nights!=null?' · '+nights+' nocí':''}</div></div></div><button class="btn sm" data-act="gotostop" data-id="${s.id}">Detail</button></div>

    ${ph.length?`<div class="row" style="margin-top:8px;gap:6px">${ph.slice(0,4).map(p=>`<img src="${esc(photoSrc(p))}" alt="" loading="lazy" style="width:54px;height:54px;object-fit:cover;border-radius:8px">`).join('')}</div>`:''}
    ${evs.map(e=>evHtml({e,s:null})).join('')}
    ${bks.map(b=>`<div class="ev"><span class="tag wait">REZERVACE</span><span>${esc(b.title)} · ${esc(fd(b.date))}</span></div>`).join('')}</div></div>`}).join('')}</div>`;

function dayInfo(iso){
  const s=stopOnDay(iso);
  return {s,arr:!!(s&&s.a===iso),dep:!!(s&&s.o===iso&&s.o!==s.a),evs:s?eventsIn(s.c,iso,iso):[],dia:S.diary.filter(d=>d.date===iso),ph:S.photos.filter(p=>p.date===iso),bk:edit?P.bookings.filter(b=>b.date===iso):[]};
}
function calHtml(){
  const [y,m]=calM.split('-').map(Number),first=new Date(y,m-1,1),off=(first.getDay()+6)%7,nd=new Date(y,m,0).getDate(),t=todayISO();

    const iso=`${y}-${pad2(m)}-${pad2(d)}`,i=dayInfo(iso),mk=(i.arr?'<i class="a"></i>':'')+(i.evs.length?'<i></i>':'')+((i.dia.length||i.ph.length)?'<i class="a"></i>':'');

/* ================= TRASA (mapa) ================= */
const VB={x:0,y:0,w:W0,h:H0};
const zoomLvl=()=>W0/VB.w;
const setVB=()=>{const m=$('map');if(m)m.setAttribute('viewBox',`${VB.x} ${VB.y} ${VB.w} ${VB.h}`)};
function clampVB(){VB.x=Math.min(Math.max(VB.x,-20),W0-VB.w+20);VB.y=Math.min(Math.max(VB.y,-20),H0-VB.h+20)}
function toSvg(cx,cy){const s=$('map'),p=s.createSVGPoint();p.x=cx;p.y=cy;return p.matrixTransform(s.getScreenCTM().inverse())}
function zoomAt(f,cx,cy){
  const nz=Math.min(14,Math.max(1,zoomLvl()*f)),nw=W0/nz,nh=H0/nz;
  VB.x=cx-(cx-VB.x)*nw/VB.w;VB.y=cy-(cy-VB.y)*nh/VB.h;VB.w=nw;VB.h=nh;clampVB();setVB();drawOverlay();
}
function centerOn(lon,lat){VB.x=X(lon)-VB.w/2;VB.y=Y(lat)-VB.h/2;clampVB();setVB()}
function focusOn(lon,lat,zz){VB.w=W0/zz;VB.h=H0/zz;centerOn(lon,lat);drawOverlay()}
function fitRoute(){
  const xs=S.stops.map(p=>X(p.lon)),ys=S.stops.map(p=>Y(p.lat));
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const zz=Math.min(14,Math.max(1,Math.min(W0/(x1-x0+70),H0/(y1-y0+70))));
  VB.w=W0/zz;VB.h=H0/zz;VB.x=(x0+x1)/2-VB.w/2;VB.y=(y0+y1)/2-VB.h/2;clampVB();setVB();drawOverlay();
}
let routeG=new Set(),trasaBuilt=false;

const ptrs=new Map();let drag=null,moved=false,pinch=null;
function initMap(){
  const svg=$('map');
  svg.addEventListener('pointerdown',e=>{
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;
    if(ptrs.size===1)drag={x:e.clientX,y:e.clientY,vx:VB.x,vy:VB.y};
    if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:zoomLvl()};drag=null;moved=true}
  });
  svg.addEventListener('pointermove',e=>{
    if(!ptrs.has(e.pointerId))return;
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size===2&&pinch){const [a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y),m=toSvg((a.x+b.x)/2,(a.y+b.y)/2);zoomAt(pinch.z*d/pinch.d/zoomLvl(),m.x,m.y);return}
    if(drag){
      const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
      if(!moved){if(Math.hypot(dx,dy)<6)return;moved=true;try{svg.setPointerCapture(e.pointerId)}catch(_){}}
      const k=VB.w/svg.getBoundingClientRect().width;
      VB.x=drag.vx-dx*k;VB.y=drag.vy-dy*k;clampVB();setVB();
    }
  });
  const up=e=>{
    ptrs.delete(e.pointerId);
    if(ptrs.size<2)pinch=null;
    if(ptrs.size===0)drag=null;
    else if(ptrs.size===1){const p=[...ptrs.values()][0];drag={x:p.x,y:p.y,vx:VB.x,vy:VB.y}}
  };
  svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
  svg.addEventListener('wheel',e=>{e.preventDefault();const p=toSvg(e.clientX,e.clientY);zoomAt(e.deltaY<0?1.25:0.8,p.x,p.y)},{passive:false});
  svg.addEventListener('click',e=>{
    if(moved){moved=false;return}
    const g=e.target.closest('.pin');
    if(!mode){if(g){sel=g.dataset.id;refresh()}return}
    const p=toSvg(e.clientX,e.clientY),lon=+(p.x/6-118).toFixed(2),lat=+(33-p.y/6).toFixed(2);
    const gi=countryAt(lon,lat),cn=gi>=0?GEO[gi].n:'';
    if(mode==='add')form={kind:'new',d:{n:'',c:cn,a:'',o:'',t:'',tm:'',tt:'',lat,lon}};
    else{const s=S.stops[idx(sel)];s.lat=lat;s.lon=lon;if(cn)s.c=cn;mark('pub')}
    mode=null;refresh();
  });
}

  }else if(pTab==='rez'){
    const l=P.bookings.filter(b=>bFil==='Vše'||b.type===bFil).sort((a,b)=>(a.date||'9').localeCompare(b.date||'9'));
    body=`<div class="chips">${['Vše',...BK].map(k=>`<button class="chip${k===bFil?' on':''}" data-act="bfil" data-k="${k}">${k}</button>`).join('')}</div>`+
     (l.length?l.map(b=>`<div class="card" style="margin-bottom:12px"><div class="row" style="justify-content:space-between"><b>${esc(b.title)}</b><button class="tag ${b.status==='Potvrzeno'?'ok':'wait'}" style="border:0" data-act="bkst" data-id="${b.id}">${esc(b.status||'Čeká')}</button></div><div class="lab" style="margin-top:4px">${esc(b.type)}${b.date?' · '+fd(b.date):''}${b.ref?' · č. '+esc(b.ref):''}</div>${b.note?`<p style="margin:6px 0 0">${esc(b.note)}</p>`:''}<div class="row" style="margin-top:8px"><button class="btn sm bad" data-act="bkdel" data-id="${b.id}">Smazat</button></div></div>`).join(''):'<div class="card"><p class="note" style="margin:0">Zatím žádné rezervace.</p></div>')+
     `<div class="card"><h3>Nová rezervace</h3><div class="form"><div class="row"><div class="grow"><label class="l">Typ</label><select id="bt">${BK.map(k=>`<option>${k}</option>`).join('')}</select></div><div class="grow"><label class="l">Datum</label><input id="bd" type="date"></div></div>
     <label class="l">Název</label><input id="bn" placeholder="např. Let Cancún → Guatemala"><div class="row"><div class="grow"><label class="l">Číslo rezervace</label><input id="br"></div><div class="grow"><label class="l">Stav</label><select id="bs"><option>Čeká</option><option>Potvrzeno</option></select></div></div>
     <label class="l">Poznámka</label><input id="bo"><div class="row" style="margin-top:10px"><button class="btn pri" data-act="bkadd">Přidat</button></div></div></div>`;
  }else{
    body=`<div class="card"><h3>Kontakty a doklady</h3><p class="note">Soukromé poznámky: čísla pojištění, kontakty na velvyslanectví apod.</p>${P.notes.length?P.notes.map(n=>`<div class="item"><div class="t"><b>${esc(n.t)}</b><br><small style="white-space:pre-wrap">${esc(n.x)}</small></div><button class="x" data-act="notedel" data-id="${n.id}" aria-label="Smazat">✕</button></div>`).join(''):'<p class="note">Zatím nic.</p>'}</div>
     <div class="card"><h3>Nová poznámka</h3><div class="form"><input id="nt" placeholder="Název (např. Pojišťovna)"><textarea id="nx" rows="3" placeholder="Text…"></textarea><div class="row" style="margin-top:8px"><button class="btn pri" data-act="noteadd">Přidat</button></div></div></div>`;
  }
  $('v-plan').innerHTML=pageHead('Plán a rezervace','Úkoly, rezervace a důležité kontakty (soukromé)')+seg([['ukoly','Úkoly'],['rez','Rezervace'],['kont','Kontakty']],pTab,'ptab')+body;
}

/* ================= VÝBAVA ================= */
function vVybava(){
  let tot=0,all=0,packed=0;
  const kg=g=>(g/1000).toLocaleString('cs-CZ',{maximumFractionDigits:1});
  P.pack.forEach(k=>k.items.forEach(i=>{tot+=i.q*i.w;all++;if(i.c)packed++}));
  const lim=+P.limit||0,cats=P.pack.map(k=>[k.name,k.items.reduce((a,i)=>a+i.q*i.w,0)]).filter(x=>x[1]>0);
  $('v-vybava').innerHTML=pageHead('Výbava','Co sbalit a kolik to váží (soukromé)')+
   `<div class="card"><h3>Celková hmotnost (odhad)</h3><div class="mono" style="font-size:1.9rem;font-weight:600;color:var(--acc)">${kg(tot)} kg${lim?` <small style="font-size:.95rem;color:var(--mut)">/ ${lim} kg</small>`:''}</div>
    ${lim?`<div class="prog ${tot/1000>lim?'bad':tot/1000>lim*.85?'warn':''}" style="margin:8px 0"><i style="width:${Math.min(100,tot/10/lim)}%"></i></div>`:''}
    <div class="lab">Sbaleno ${packed} z ${all} věcí</div>
    ${cats.length?`<div style="margin-top:12px">${cats.map(([n,w])=>`<div class="bar"><span>${esc(n)}</span><div class="w"><i style="width:${tot?Math.round(w/tot*100):0}%"></i></div><b class="mono" style="font-size:.8rem">${kg(w)} kg</b><em>${tot?Math.round(w/tot*100):0} %</em></div>`).join('')}</div>`:''}
    <div class="row" style="margin-top:12px"><input id="vlim" type="number" min="0" step="0.5" class="grow" placeholder="Limit (kg)" value="${lim||''}"><button class="btn sm" data-act="vlim">Nastavit limit</button></div></div>`+
   P.pack.map(k=>{const w=k.items.reduce((a,i)=>a+i.q*i.w,0),pk=k.items.filter(i=>i.c).length;
    return `<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">${esc(k.name)}</h3><span class="lab">${pk}/${k.items.length} · ${kg(w)} kg</span></div>
    ${k.items.length?k.items.map(i=>`<div class="item${i.c?' ck':''}"><input type="checkbox" data-chg="itemtog" data-k="${k.id}" data-i="${i.id}"${i.c?' checked':''}><div class="t">${esc(i.t)}<br><small>${i.q}× · ${i.w} g</small></div><button class="x" data-act="itemdel" data-k="${k.id}" data-i="${i.id}" aria-label="Smazat">✕</button></div>`).join(''):'<p class="note">Prázdná kategorie.</p>'}
    <div class="row" style="margin-top:8px"><button class="btn sm bad" data-act="catdel" data-k="${k.id}">Smazat kategorii</button></div></div>`}).join('')+
   `<div class="card"><h3>Přidat věc</h3><div class="form"><label class="l">Název</label><input id="vn" placeholder="např. Pláštěnka">
    <div class="row"><div class="grow"><label class="l">Kategorie</label><select id="vc">${P.pack.map(k=>`<option value="${k.id}">${esc(k.name)}</option>`).join('')}</select></div><div class="grow"><label class="l">Počet</label><input id="vq" type="number" min="1" value="1"></div><div class="grow"><label class="l">Váha 1 ks (g)</label><input id="vw" type="number" min="0" value="0"></div></div>
    <div class="row" style="margin-top:10px"><button class="btn pri" data-act="itemadd">Přidat věc</button></div></div></div>
   <div class="card"><h3>Nová kategorie</h3><div class="row"><input id="vk" class="grow" placeholder="např. Léky"><button class="btn pri" data-act="catadd">Přidat</button></div></div>`;
}

/* ================= NASTAVENÍ ================= */
function vNast(){
  const th=LS.get('theme','dark');
  $('v-nast').innerHTML=pageHead('Nastavení','')+
   `<div class="card"><h3>Vzhled</h3><select data-chg="theme"><option value="dark"${th==='dark'?' selected':''}>Tmavý kokpit</option><option value="light"${th==='light'?' selected':''}>Světlý</option></select></div>
   <div class="card"><h3>Správce (GitHub)</h3><p class="note">Jen správce potřebuje token. Ostatní stránku jen čtou.${edit?' <b>Jsi přihlášen jako správce.</b>':''}</p><div class="form">
    <label class="l">GitHub uživatel</label><input id="gho" value="${esc(GH.owner)}"><label class="l">Veřejný repozitář (stránka)</label><input id="ghr" value="${esc(GH.repo)}">
    <label class="l">Soukromý repozitář pro rozpočet, rezervace a výbavu (volitelné)</label><input id="ghp" value="${esc(GH.pr||'')}" placeholder="např. cesta-soukrome">
    <label class="l">Přístupový token</label><input id="ght" type="password" autocomplete="off" placeholder="${TOKEN?'(uložen v tomto prohlížeči)':'github_pat_…'}">
    <div class="row" style="margin-top:10px"><button class="btn pri" data-act="admsave">Uložit</button><button class="btn" data-act="admout">Odhlásit</button></div></div>
    <p class="note" style="margin:10px 0 0">Bez soukromého repozitáře se rozpočet, úkoly, rezervace a výbava ukládají jen v tomto prohlížeči. Do veřejného repozitáře je nedávej.</p></div>
   ${edit?`<div class="card"><h3>Kurzy měn (Kč za 1 jednotku)</h3><p class="note">Orientační hodnoty – uprav nebo stáhni aktuální.</p><div class="row">${CUR.filter(c=>c[0]!=='CZK').map(([c])=>`<div style="width:92px"><label class="l">${c}</label><input id="rt_${c}" type="number" step="0.0001" value="${rate(c)}"></div>`).join('')}</div>
    <div class="row" style="margin-top:10px"><button class="btn pri" data-act="ratesave">Uložit kurzy</button><button class="btn" data-act="ratefetch">Stáhnout aktuální</button></div></div>
   <div class="card"><h3>Záloha dat</h3><div class="row"><button class="btn" data-act="export">Exportovat</button><label class="btn" style="cursor:pointer">Importovat<input type="file" accept="application/json" data-chg="import" style="display:none"></label></div></div>`:''}
   <div class="card"><h3>O stránce</h3><p class="note" style="margin:0">Cancún → Buenos Aires · glóbus a mapa se zeměmi, informace o zemích, předpověď (Open-Meteo), zprávy ze skriptu. Veřejná část (trasa, poloha, deník, místa, fotky, zprávy) je viditelná všem s odkazem.</p></div>`;
}

/* ================= UDÁLOSTI ================= */
const stopOf=()=>S.stops[idx(sel)];
const ACT={
  go:t=>go(t.dataset.v),
  more:()=>{moreOpen=!moreOpen;renderNav()},
  gotostop:t=>{sel=t.dataset.id;go('trasa');const s=stopOf();if(s)focusOn(s.lon,s.lat,Math.max(zoomLvl(),2.5))},
  tozeme:t=>{zSel=t.dataset.k;zTab='prehled';go('zeme')},
  towx:t=>{wxSel=t.dataset.id;go('pocasi')},
  zsel:t=>{zSel=t.dataset.k;refresh()},
  ztab:t=>{zTab=t.dataset.k;refresh()},
  nsel:t=>{nSel=t.dataset.k;refresh()},
  otab:t=>{oTab=t.dataset.k;refresh()},
  calprev:()=>{const [y,m]=calM.split('-').map(Number),d=new Date(y,m-2,1);calM=d.getFullYear()+'-'+pad2(d.getMonth()+1);refresh()},
  calnext:()=>{const [y,m]=calM.split('-').map(Number),d=new Date(y,m,1);calM=d.getFullYear()+'-'+pad2(d.getMonth()+1);refresh()},
  calsel:t=>{calSel=t.dataset.d;refresh()},
  fsel:t=>{fSel=t.dataset.k;refresh()},
  lb:t=>{const b=$('lb');b.innerHTML=`<img src="${esc(t.dataset.src)}" alt=""><p>${esc(t.dataset.cap||'')}</p>`;b.classList.remove('hide')},
  lbclose:()=>$('lb').classList.add('hide'),
  zi:()=>zoomAt(1.6,VB.x+VB.w/2,VB.y+VB.h/2),
  zo:()=>zoomAt(1/1.6,VB.x+VB.w/2,VB.y+VB.h/2),
  zh:()=>{const s=curStop();focusOn(s.lon,s.lat,5)},
  zr:()=>fitRoute(),
  sel:t=>{sel=t.dataset.id;const s=stopOf();if(zoomLvl()>1.2)centerOn(s.lon,s.lat);refresh()},
  dtab:t=>{dTab=t.dataset.k;refresh()},
  addmode:()=>{mode='add';form=null;refresh()},
  cancelmode:()=>{mode=null;refresh()},
  move:()=>{mode='move';refresh()},
  here:()=>{S.cur=sel;S.upd=Date.now();mark('pub');refresh()},
  edit:()=>{form={kind:'edit',d:{...stopOf()}};refresh()},
  up:()=>{const i=idx(sel);if(i>0){[S.stops[i-1],S.stops[i]]=[S.stops[i],S.stops[i-1]];mark('pub');refresh()}},
  down:()=>{const i=idx(sel);if(i<S.stops.length-1){[S.stops[i+1],S.stops[i]]=[S.stops[i],S.stops[i+1]];mark('pub');refresh()}},
  del:()=>{
    const i=idx(sel);if(S.stops.length<2||!confirm('Smazat zastávku „'+S.stops[i].n+'“?'))return;
    const id=S.stops[i].id;S.stops.splice(i,1);S.diary=S.diary.filter(d=>d.sid!==id);S.places=S.places.filter(p=>p.sid!==id);S.photos=S.photos.filter(p=>p.sid!==id);
    sel=S.stops[Math.max(0,i-1)].id;if(idx(S.cur)<0){S.cur=sel;S.upd=Date.now()}mark('pub');refresh();
  },
  formno:()=>{form=null;refresh()},
  formok:()=>{
    const d=form.d;d.n=$('fn').value.trim()||'Bez názvu';d.c=$('fc').value.trim();d.a=$('fa').value;d.o=$('fo').value;d.t=$('ft').value.trim();d.tm=$('ftm').value;d.tt=$('ftt').value.trim();
    if(form.kind==='new'){d.id='s'+uid();S.stops.splice(idx(sel)+1,0,d);sel=d.id}else Object.assign(S.stops[idx(d.id)],d);
    form=null;mark('pub');refresh();
  },
  diaryadd:()=>{const v=$('dtext').value.trim();if(!v)return;S.diary.push({id:'d'+uid(),sid:sel,date:todayISO(),text:v});mark('pub');refresh()},
  diarydel:t=>{S.diary=S.diary.filter(d=>d.id!==t.dataset.id);mark('pub');refresh()},
  placeadd:()=>{const n=$('pln').value.trim();if(!n)return;S.places.push({id:'m'+uid(),sid:sel,type:$('plt').value,name:n,note:$('plo').value.trim(),url:$('plu').value.trim()});mark('pub');refresh()},
  placerec:t=>{const s=stopOf(),i=INFO.find(c=>c.k===s.c);if(!i)return;S.places.push({id:'m'+uid(),sid:sel,type:'Zajímavost',name:i.top[+t.dataset.i],note:'',url:''});mark('pub');refresh()},
  placedel:t=>{S.places=S.places.filter(p=>p.id!==t.dataset.id);mark('pub');refresh()},
  photoadd:async()=>{
    const f=$('pf')&&$('pf').files[0];if(!f){fabMsg='Vyber nejdřív fotku';fab();return}
    fabMsg='Nahrávám fotku…';fab();
    try{await addPhoto(f,$('ps').value,$('pc').value.trim());fabMsg='Fotka nahrána – ulož a zveřejni'}catch(e){fabMsg='Nahrání selhalo ('+e.message+')'}
    refresh();
  },
  photodel:async t=>{
    if(!confirm('Smazat fotku?'))return;
    const p=S.photos.find(x=>x.id===t.dataset.id);S.photos=S.photos.filter(x=>x.id!==t.dataset.id);mark('pub');refresh();
    if(p&&TOKEN)try{await ghDelete(GH.repo,p.f)}catch(e){}
  },
  save:()=>saveAll(),
  btab:t=>{bTab=t.dataset.k;refresh()},
  blim:()=>{P.total=+$('blim').value||0;mark('priv');refresh()},
  expadd:()=>{const a=parseFloat($('ea').value);if(!(a>0))return;P.expenses.push({id:'e'+uid(),date:$('ed').value||todayISO(),country:$('ec').value,cat:$('ek').value,amt:a,cur:$('ecu').value,note:$('en').value.trim()});mark('priv');refresh()},
  expdel:t=>{P.expenses=P.expenses.filter(e=>e.id!==t.dataset.id);mark('priv');refresh()},
  ptab:t=>{pTab=t.dataset.k;refresh()},
  bfil:t=>{bFil=t.dataset.k;refresh()},
  taskadd:()=>{const v=$('tt').value.trim();if(!v)return;P.tasks.push({id:'t'+uid(),t:v,due:$('td').value,done:false});mark('priv');refresh()},
  taskdel:t=>{P.tasks=P.tasks.filter(x=>x.id!==t.dataset.id);mark('priv');refresh()},
  bkadd:()=>{const v=$('bn').value.trim();if(!v)return;P.bookings.push({id:'b'+uid(),type:$('bt').value,title:v,date:$('bd').value,ref:$('br').value.trim(),status:$('bs').value,note:$('bo').value.trim()});mark('priv');refresh()},
  bkdel:t=>{P.bookings=P.bookings.filter(x=>x.id!==t.dataset.id);mark('priv');refresh()},
  bkst:t=>{const b=P.bookings.find(x=>x.id===t.dataset.id);b.status=b.status==='Potvrzeno'?'Čeká':'Potvrzeno';mark('priv');refresh()},
  noteadd:()=>{const t=$('nt').value.trim();if(!t)return;P.notes.push({id:'n'+uid(),t,x:$('nx').value});mark('priv');refresh()},
  notedel:t=>{P.notes=P.notes.filter(x=>x.id!==t.dataset.id);mark('priv');refresh()},
  vlim:()=>{P.limit=+$('vlim').value||0;mark('priv');refresh()},
  itemadd:()=>{const n=$('vn').value.trim(),k=P.pack.find(x=>x.id===$('vc').value);if(!n||!k)return;k.items.push({id:'i'+uid(),t:n,c:false,q:Math.max(1,+$('vq').value||1),w:Math.max(0,+$('vw').value||0)});mark('priv');refresh()},
  itemdel:t=>{const k=P.pack.find(x=>x.id===t.dataset.k);k.items=k.items.filter(i=>i.id!==t.dataset.i);mark('priv');refresh()},
  catadd:()=>{const n=$('vk').value.trim();if(!n)return;P.pack.push({id:'k'+uid(),name:n,items:[]});mark('priv');refresh()},
  catdel:t=>{const k=P.pack.find(x=>x.id===t.dataset.k);if(!confirm('Smazat kategorii „'+k.name+'“ včetně věcí?'))return;P.pack=P.pack.filter(x=>x.id!==k.id);mark('priv');refresh()},
  admsave:()=>{
    GH.owner=$('gho').value.trim();GH.repo=$('ghr').value.trim();GH.pr=$('ghp').value.trim();
    const t=$('ght').value.trim();if(t)TOKEN=t;
    LS.set('gh_cfg',{owner:GH.owner,repo:GH.repo,pr:GH.pr});LS.set('gh_token',TOKEN);
    enableEdit();refresh();
  },
  admout:()=>{TOKEN='';LS.del('gh_token');edit=false;go('home')},
  ratesave:()=>{CUR.forEach(([c])=>{if(c==='CZK')return;const v=parseFloat($('rt_'+c).value);if(v>0)P.rates[c]=v});mark('priv');refresh()},
  ratefetch:async()=>{
    try{const r=await fetch('https://open.er-api.com/v6/latest/CZK'),j=await r.json();
      CUR.forEach(([c])=>{if(c!=='CZK'&&j.rates&&j.rates[c])P.rates[c]=+(1/j.rates[c]).toPrecision(4)});
      mark('priv');refresh();
    }catch(e){fabMsg='Kurzy se nepodařilo stáhnout';fab()}
  },
  export:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({public:pubOut(),private:P},null,1)],{type:'application/json'}));a.download='cesta-zaloha.json';a.click()}
};
const CHG={
  wxsel:t=>{wxSel=t.value;refresh()},
  ecsel:t=>{const c=CCUR[t.value];if(c&&$('ecu'))$('ecu').value=c},
  tasktog:t=>{const x=P.tasks.find(x=>x.id===t.dataset.id);x.done=t.checked;mark('priv');refresh()},
  itemtog:t=>{const i=P.pack.find(k=>k.id===t.dataset.k).items.find(i=>i.id===t.dataset.i);i.c=t.checked;mark('priv');refresh()},
  theme:t=>{LS.set('theme',t.value);document.documentElement.setAttribute('data-theme',t.value);if(G.col)globeColors()},
  import:t=>{
    const f=t.files[0];if(!f)return;
    f.text().then(x=>{const j=JSON.parse(x);if(j.public&&j.public.stops){S=j.public;S.diary=S.diary||[];S.places=S.places||[];S.photos=S.photos||[];sel=S.cur;dirty.pub=true}if(j.private){P=Object.assign(P,j.private);ensureP();mark('priv')}refresh()}).catch(()=>{fabMsg='Import selhal';fab()});
  }
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!t){if(moreOpen&&!e.target.closest('#sheet')){moreOpen=false;renderNav()}return}
  const f=ACT[t.dataset.act];if(!f)return;
  if(t.tagName==='A')e.preventDefault();
  f(t,e);
});
document.addEventListener('change',e=>{const t=e.target.closest('[data-chg]');if(t&&CHG[t.dataset.chg])CHG[t.dataset.chg](t,e)});

/* ================= START ================= */
(function init(){
  document.documentElement.setAttribute('data-theme',LS.get('theme','dark'));
  if(TOKEN&&GH.owner&&GH.repo)edit=true;
  const h=location.hash.slice(1);if(viewOk(h))view=h;
  refresh();loadPublic();loadNews();loadPrivate();
  setInterval(()=>{if(!edit&&!dirty.pub)loadPublic();loadNews()},180000);
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
