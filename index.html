<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C0A0E">
<meta name="color-scheme" content="dark">
<title>Cancún → Buenos Aires</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Cdefs%3E%3ClinearGradient id=%22g%22 x1=%220%22 y1=%220%22 x2=%221%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%23FF9A5C%22/%3E%3Cstop offset=%221%22 stop-color=%22%23FF4F9A%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%22100%22 height=%22100%22 rx=%2230%22 fill=%22%230C0A0E%22/%3E%3Ccircle cx=%2250%22 cy=%2244%22 r=%2218%22 fill=%22url(%23g)%22/%3E%3Cpath d=%22M50 86 31 56h38z%22 fill=%22url(%23g)%22/%3E%3C/svg%3E">
<style>
@font-face{font-family:'Figtree';font-style:normal;font-weight:400 800;font-display:swap;src:url(fonts/figtree-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF}
@font-face{font-family:'Figtree';font-style:normal;font-weight:400 800;font-display:swap;src:url(fonts/figtree-latin.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
:root{color-scheme:dark;
--bg:#0C0A0E;--bg2:rgba(255,255,255,.08);--panel:rgba(255,255,255,.07);--panel2:rgba(255,255,255,.05);--solid:#18141A;
--line:rgba(255,255,255,.1);--rim:rgba(255,255,255,.14);--rim2:rgba(255,255,255,.26);
--tx:#F7F2EF;--mut:#BCB1AE;--mut2:#91878A;
--peach:#FFB08F;--rose:#E2789A;--grad:linear-gradient(120deg,#FF9A5C,#FF4F9A);
--acc:#FFB08F;--acc-tx:#1B0E0A;--acc-soft:rgba(255,176,143,.16);--cool:#8EC5FF;
--now:#FF6A88;--now-tx:#FF9AAE;--now-soft:rgba(255,106,136,.18);
--done:#FFFFFF;--done-tx:#FFFFFF;--done-soft:rgba(255,255,255,.14);--next:#6E6569;
--ok:#7FDDB0;--ok-soft:rgba(127,221,176,.16);
--bad:#FF7272;--bad-soft:rgba(255,114,114,.16);--warn:#F6BE63;--warn-soft:rgba(246,190,99,.16);
--sea:#0E0C11;--land:#211C23;--land-s:#3D343E;--pin-tx:#140B0E;
--p0:#2B2328;--p1:#22262F;--p2:#2E2A20;--p3:#30231F;--p4:#28243A;--p5:#33212A;--p6:#25291F;
--blur:blur(22px) saturate(150%);
--lift:inset 0 1px 0 rgba(255,255,255,.1),0 22px 44px -24px rgba(0,0,0,.75);
--r-xl:30px;--r-lg:24px;--r-md:18px;--r-sm:12px;
--ease:cubic-bezier(.22,1,.36,1);--disp:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--ui:var(--disp)}
*{box-sizing:border-box}
html,body{margin:0}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{background:var(--bg);color:var(--tx);font:15px/1.5 var(--ui);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;min-height:100vh}
::selection{background:var(--peach);color:var(--acc-tx)}
button{font:inherit;cursor:pointer;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.015em;text-wrap:balance}
a{color:var(--peach);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--peach);outline-offset:3px;border-radius:10px}
.lab{font-size:.78rem;font-weight:500;color:var(--mut)}
.mono{font-variant-numeric:tabular-nums}
.hide{display:none!important}
svg{flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
::-webkit-scrollbar{height:8px;width:8px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:8px}
html{scrollbar-color:rgba(255,255,255,.18) transparent}

/* ambientní pozadí: rozmazaná fotka aktuálního místa */
#amb{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:var(--bg)}
#amb img{position:absolute;z-index:0;inset:-12%;width:124%;height:124%;object-fit:cover;filter:blur(64px) saturate(.85) sepia(.3) brightness(.66);opacity:0;transition:opacity 1.2s var(--ease)}
#amb img.on{opacity:.95}
#amb::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(160deg,#F4A98A 0%,#E2789A 55%,#B9694C 100%);mix-blend-mode:color;opacity:.42}
#amb::after{content:"";position:absolute;inset:0;z-index:2;background:radial-gradient(70% 45% at 12% 0%,rgba(255,170,130,.38),transparent 70%),radial-gradient(60% 50% at 100% 55%,rgba(226,120,154,.3),transparent 70%),linear-gradient(180deg,rgba(12,10,14,.25) 0%,rgba(12,10,14,.62) 55%,rgba(12,10,14,.9) 100%)}

/* skelet */
.app{position:relative;z-index:1;min-height:100vh}
.main{padding:22px 32px 140px;max-width:1200px;margin:0 auto}
@media(max-width:860px){.main{padding:calc(14px + env(safe-area-inset-top,0px)) 16px 150px}}
.view{display:none}.view.on{display:block;animation:rise .5s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* hlavička obrazovky */
.pagehead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:2px 0 18px;min-height:48px}
.pagehead h1{font-size:clamp(1.75rem,5.4vw,2.3rem);line-height:1.05;letter-spacing:-.025em;font-weight:600}
.pagehead .sub{color:var(--mut);margin:4px 0 0;font-size:.9rem}
.pagehead .hb{display:flex;gap:8px;align-items:center;flex:none}
.cbtn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--rim);background:rgba(255,255,255,.08);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);color:var(--tx);box-shadow:inset 0 1px 0 rgba(255,255,255,.12);position:relative;padding:0;text-decoration:none;transition:background .25s,border-color .25s,transform .25s var(--ease);flex:none}
.cbtn:hover{background:rgba(255,255,255,.16);border-color:var(--rim2)}
.cbtn:active{transform:scale(.94)}
.cbtn.sm{width:38px;height:38px}
.cbtn .bd{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--now);box-shadow:0 0 0 2px #2a1f24}

/* sklo */
.card,.glass{background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.05));border:1px solid var(--rim);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--lift)}
.card{border-radius:var(--r-lg);padding:18px}
.card h3{font-size:1.06rem;margin-bottom:12px;font-weight:600}
.card+.card,.card+.grid2,.grid2+.card,.grid2+.grid2,.card+.sec-h,.sec-h+.card{margin-top:14px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.grid2>.card{margin-top:0!important}
@media(min-width:900px){.grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.grid2.glob{align-items:start}}
.note{font-size:.84rem;color:var(--mut);margin:0 0 12px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 2px 12px}
.sec-h h2{font-size:1.2rem;font-weight:600;letter-spacing:-.01em}
.sec-h a,.sec-h button{font-weight:500;font-size:.84rem;color:var(--mut);background:none;border:0;padding:6px 2px;text-decoration:none}
.sec-h button:hover{color:var(--tx)}

/* tlačítka a pole */
.btn{border:1px solid var(--rim);background:rgba(255,255,255,.08);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-radius:99px;padding:10px 18px;font-weight:500;font-size:.88rem;color:var(--tx);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;min-height:44px;transition:background .2s,border-color .2s,transform .2s var(--ease)}
.btn:hover{background:rgba(255,255,255,.15);border-color:var(--rim2)}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(120deg,rgba(255,154,92,.32),rgba(255,79,154,.26));border-color:rgba(255,170,140,.7);color:#FFF1EA;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 22px -14px rgba(0,0,0,.6)}
.btn.pri:hover{background:linear-gradient(120deg,rgba(255,154,92,.44),rgba(255,79,154,.36))}
.btn.sm{padding:7px 14px;font-size:.82rem;min-height:38px}
.btn.bad{color:var(--bad);border-color:rgba(255,114,114,.35)}
.btn.ghost{background:rgba(255,255,255,.08)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1;min-width:120px}
input,select,textarea{width:100%;min-width:0;padding:12px 14px;border:1px solid var(--rim);border-radius:var(--r-md);background:rgba(255,255,255,.06);color:var(--tx);font:inherit;caret-color:var(--peach);transition:border-color .2s,background .2s}
select option{background:#1D181E;color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:none;border-color:rgba(255,176,143,.75);background:rgba(255,255,255,.09);box-shadow:0 0 0 3px rgba(255,176,143,.16)}
input::placeholder,textarea::placeholder{color:var(--mut2)}
input[type=file]{padding:10px}
input[type=file]::file-selector-button{font:inherit;font-size:.82rem;font-weight:500;color:var(--tx);background:rgba(255,255,255,.1);border:1px solid var(--rim);border-radius:99px;padding:6px 14px;margin-right:12px;cursor:pointer}
label.l{display:block;font-size:.8rem;font-weight:500;color:var(--mut);margin:12px 0 6px}
.form{display:grid;gap:2px}
.form .row+input,.form input+.row,.form input+input{margin-top:8px}

/* pilulky: záložky a filtry */
.chips,.seg{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;margin-bottom:14px;scrollbar-width:none}
.chips::-webkit-scrollbar,.seg::-webkit-scrollbar{display:none}
.chip,.seg button{flex:none;display:inline-flex;gap:8px;align-items:center;padding:8px 16px;border:1px solid var(--rim);background:rgba(255,255,255,.07);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-radius:99px;font-size:.86rem;font-weight:500;color:var(--tx);min-height:40px;white-space:nowrap;transition:background .25s,border-color .25s,box-shadow .25s,color .25s}
.chip:hover,.seg button:hover{background:rgba(255,255,255,.13)}
.chip.on,.seg button.on{background:linear-gradient(120deg,rgba(255,154,92,.34),rgba(255,120,140,.2));border-color:rgba(255,176,143,.8);color:#FFF3EC;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 6px 16px -10px rgba(0,0,0,.55)}
.chip .flag{box-shadow:none}
.chip.cur::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--now)}
.tiles,.qa{display:flex;flex-wrap:wrap;gap:8px}
.tile{display:inline-flex;gap:10px;align-items:center;border:1px solid var(--rim);background:rgba(255,255,255,.07);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-radius:99px;padding:7px 16px 7px 7px;font-weight:500;font-size:.88rem;min-height:46px;transition:background .2s,border-color .2s}
.tile:hover{background:rgba(255,255,255,.14);border-color:var(--rim2)}
.tile .ic{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;flex:none}
.tile b{font-weight:500}

/* stavové prvky */
.pill{display:inline-flex;gap:7px;align-items:center;font-size:.78rem;font-weight:500;color:var(--tx);background:rgba(255,255,255,.08);border:1px solid var(--rim);padding:4px 11px;border-radius:99px}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
@keyframes pulse{50%{opacity:.35}}
.flag{display:inline-block;border-radius:50%;box-shadow:0 0 0 1.5px rgba(255,255,255,.35);vertical-align:middle;flex:none}
.prog{height:4px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--grad);border-radius:4px}
.prog.warn i{background:var(--warn)}.prog.bad i{background:var(--bad)}
.alert{display:flex;gap:12px;align-items:flex-start;border-radius:var(--r-lg);padding:14px 16px;margin:16px 0 0;font-size:.9rem;border:1px solid rgba(246,190,99,.35);background:linear-gradient(180deg,rgba(246,190,99,.16),rgba(246,190,99,.07));-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.alert.bad{border-color:rgba(255,114,114,.4);background:linear-gradient(180deg,rgba(255,114,114,.18),rgba(255,114,114,.07))}
.alert b{font-weight:600}
.alert a{font-weight:500;color:var(--tx)}
.dotc{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;flex:none}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.tag{display:inline-block;border-radius:99px;padding:3px 10px;font-size:.72rem;font-weight:600;background:rgba(255,255,255,.1);color:var(--tx);white-space:nowrap;border:1px solid transparent}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.wait{background:var(--warn-soft);color:var(--warn)}
.tag.sev-nebezpeci{background:var(--bad-soft);color:var(--bad)}
.tag.sev-pozor{background:var(--warn-soft);color:var(--warn)}
.tag.sev-info{background:var(--acc-soft);color:var(--peach)}
.here{display:inline-block;background:var(--grad);color:var(--acc-tx);border-radius:99px;padding:1px 9px;font-size:.7rem;margin-left:8px;font-weight:600;letter-spacing:0;vertical-align:2px}
.hint{background:var(--acc-soft);border:1px solid rgba(255,176,143,.35);border-radius:var(--r-md);padding:12px 14px;margin-bottom:12px;font-size:.9rem}

/* rámovaná fotka (foto v jemném skleněném rámu) */
.frame{position:relative;border-radius:var(--r-xl);padding:5px;background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.07));border:1px solid var(--rim);box-shadow:var(--lift)}
.frame .pic{position:relative;border-radius:calc(var(--r-xl) - 5px);overflow:hidden;background:var(--tint,var(--p0));height:100%}
.frame .pic>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.frame .pic::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(10,6,10,.6),rgba(10,6,10,0) 42%),linear-gradient(to bottom,rgba(10,6,10,.28),rgba(10,6,10,0) 24%);pointer-events:none}
.stack{position:relative;padding-top:14px}
.stack::before,.stack::after{content:"";position:absolute;left:7%;right:7%;top:0;height:60%;border-radius:var(--r-xl);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.stack::after{left:3.5%;right:3.5%;top:7px;background:rgba(255,255,255,.09)}
.stack>.frame{z-index:1}
.ov{position:absolute;z-index:2;display:flex;gap:8px;align-items:center}
.ov.otl{top:14px;left:14px}.ov.otr{top:14px;right:14px}
.gchip{display:inline-flex;align-items:center;gap:7px;padding:5px 12px 5px 6px;border-radius:99px;background:rgba(20,14,18,.35);border:1px solid rgba(255,255,255,.22);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);color:#fff;font-size:.8rem;font-weight:500;white-space:nowrap}
.gchip.np{padding-left:12px}
.dots{position:absolute;z-index:2;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:5px}
.dots i{width:6px;height:6px;border-radius:6px;background:rgba(255,255,255,.35);transition:width .4s var(--ease)}
.dots i.d{background:rgba(255,255,255,.85)}
.dots i.n{width:20px;background:#fff}
.trow{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.loc{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:.88rem;margin-top:4px}
.loc svg{opacity:.85}
.desc{color:#E6DCD8;font-size:.92rem;line-height:1.55;margin:12px 0 0;max-width:62ch}

/* přehled: hero */
.stat-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--mut);font-size:.86rem;margin-top:6px}
.hero{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.hero .frame{aspect-ratio:4/4.3;max-height:560px}
.hero .name{font-size:clamp(1.8rem,6.4vw,2.6rem);font-weight:600;line-height:1.05;letter-spacing:-.025em}
.hwx{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:.95rem;white-space:nowrap;color:var(--tx)}
.hwx svg{color:var(--peach)}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.stat{background:rgba(255,255,255,.08);border:1px solid var(--rim);color:var(--tx);border-radius:99px;padding:5px 12px;font-size:.8rem;font-weight:500;white-space:nowrap}
.hero .prog{margin-top:14px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0}
@media(min-width:900px){.hero{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:end;gap:32px}.hero .frame{aspect-ratio:16/11}.hmeta{padding-bottom:10px}}

/* deník z přehledu (pole s odesláním) */
.composer{margin-top:16px;border-radius:var(--r-lg);padding:6px;border:1.5px solid transparent;background:linear-gradient(rgba(24,18,24,.82),rgba(24,18,24,.82)) padding-box,linear-gradient(120deg,rgba(255,154,92,.8),rgba(255,79,154,.7)) border-box;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.composer textarea{border:0;background:transparent;resize:none;padding:12px 12px 6px;min-height:52px;box-shadow:none}
.composer textarea:focus{box-shadow:none;background:transparent}
.composer .cr{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 2px}
.send{width:42px;height:42px;border-radius:50%;border:0;background:var(--grad);color:#fff;display:grid;place-items:center;box-shadow:0 8px 18px -8px rgba(0,0,0,.6);transition:transform .2s var(--ease)}
.send:active{transform:scale(.92)}

/* vodorovné řady fotokaret */
.rail{position:relative;display:flex;gap:12px;overflow-x:auto;padding:4px 16px 16px;margin:0 -16px;scroll-snap-type:x proximity;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
@media(min-width:861px){.rail{margin:0 -4px;padding:4px 4px 16px}}
.pc{position:relative;flex:none;width:168px;aspect-ratio:3/3.9;border-radius:26px;padding:4px;border:1px solid var(--rim);background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.06));color:#fff;text-align:left;scroll-snap-align:start;box-shadow:var(--lift);transition:transform .35s var(--ease),border-color .3s,box-shadow .3s}
.pc:hover{transform:translateY(-3px)}
.pc .pic{position:absolute;inset:4px;border-radius:22px;overflow:hidden;background:var(--tint,var(--p0))}
.pc .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pc .pic::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(8,5,8,.82),rgba(8,5,8,0) 58%),linear-gradient(to bottom,rgba(8,5,8,.3),rgba(8,5,8,0) 30%)}
.pc .big{position:absolute;right:12px;top:30px;font-size:4.4rem;font-weight:700;opacity:.18;line-height:1}
.pc .n{position:absolute;top:11px;left:11px;z-index:1}
.pc .st{position:absolute;top:11px;right:11px;z-index:1}
.pc .st.ok{width:30px;height:30px;padding:0;justify-content:center;border-radius:50%}
.pc .gchip{font-size:.74rem;padding:4px 10px}
.pc .in{position:absolute;left:14px;right:12px;bottom:12px;z-index:1}
.pc b{display:block;font-size:1.02rem;font-weight:600;line-height:1.15;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc small{display:flex;align-items:center;gap:4px;font-size:.74rem;opacity:.86;margin-top:3px;white-space:nowrap;overflow:hidden}
.pc.now{border-color:rgba(255,176,143,.85);box-shadow:var(--lift),0 0 0 1px rgba(255,140,120,.35)}
.pc.now .st{background:var(--grad);border-color:transparent;color:var(--acc-tx)}
.pc.sel{border-color:#fff;box-shadow:var(--lift),0 0 0 2px rgba(255,255,255,.5)}
.pc.done .pic img{filter:saturate(.75)}
.srail .pc{width:140px}

/* glóbus */
.globewrap{position:relative;display:grid;place-items:center}
#globe{width:100%;max-width:380px;aspect-ratio:1;display:block;touch-action:none;cursor:grab}
.globewrap .zoom{top:4px;right:4px}
.globewrap .cbtn{width:38px;height:38px}

<script>

{k:"Mexiko",f:"🇲🇽",m:"peso (MXN) · 127 V, zásuvky A/B",
h:"Nejstarší vyspělou kulturou byli Olmékové (kolem 1200–400 př. n. l.) na pobřeží Mexického zálivu. Po nich vzkvétalo Teotihuacán, největší město předkolumbovské Ameriky, a mayská města na Yucatánu (Chichén Itzá, Uxmal, Palenque). Aztékové založili kolem 1325 Tenochtitlán na ostrově v jezeře Texcoco a vybudovali říši s miliony poddaných. Hernán Cortés přistál 1519 a díky spojenectví s domorodými rivaly a epidemii neštovic dobyl Tenochtitlán 1521. Následovaly tři století Nového Španělska. Povstání zahájil kněz Miguel Hidalgo výzvou „Grito de Dolores“ (16. 9. 1810), samostatnost přišla 1821. Mexiko pak ztratilo Texas (1836) a ve válce s USA (1846–48) i Kalifornii a Nové Mexiko, zažilo francouzskou intervenci a císaře Maxmiliána (1864–67, popraven) i diktaturu Porfiria Díaze. Revoluce (1910–1920; Zapata, Pancho Villa) vedla k ústavě 1917 a k vládě strany PRI, která trvala do roku 2000.",

{k:"Guatemala",f:"🇬🇹",m:"quetzal (GTQ) · 120 V, zásuvky A/B",
h:"Mayové zde budovali města už od zhruba 1000 př. n. l. V předklasické době stála obří pyramida La Danta v El Miradoru, v klasickém období (250–900 n. l.) vrcholil Tikal. Kolem roku 900 se městské státy v nížinách zhroutily (sucho, války), mayská vysočina ale přežila. Pedro de Alvarado dobyl zemi 1523–24 se spojenci z řad Tlaxcalteků a Kakchikelů a porazil K'iche' (legenda o Tecún Umánovi). Kapitánie Guatemala pak spravovala celou Střední Ameriku od Chiapasu po Kostariku. Hlavním městem byla Antigua, dokud ji 1773 nezničilo zemětřesení (hlavní město se přesunulo do dnešního Guatemala City). Nezávislost 1821, krátké připojení k Mexiku a Federace Střední Ameriky (1823–41). Převrat 1954 podporovaný CIA svrhl prezidenta Árbenze, který chtěl pozemkovou reformu na úkor United Fruit Company, a otevřel cestu k občanské válce 1960–1996. Zahynulo přes 200 000 lidí, většinou mayských civilistů. V 80. letech za Ríose Montta šlo o genocidu domorodců. Rigoberta Menchú za svědectví získala 1992 Nobelovu cenu míru.",
top:["Antigua Guatemala (UNESCO) a noční výstup na Acatenango (výhled na erupce Fuego)","Jezero Atitlán a vesnice kolem (San Pedro, San Marcos, Panajachel)","Tikal v džungli a Flores","Semuc Champey, Lanquín","Quetzaltenango (Xela), trh Chichicastenango"],

{k:"Salvador",f:"🇸🇻",m:"americký dolar (USD) · 115 V, zásuvky A/B",
h:"Zemi obývali Pipilové (nahuatlsky mluvící národ; jméno Cuzcatlán znamená země drahokamů) a Lencové. Ve vesnici Joya de Cerén se dochovalo mayské sídlo zasypané sopečným popelem kolem roku 600, často nazývané americké Pompeje. Alvarado vstoupil do Cuzcatlánu 1524, podrobení země trvalo do 1540. Kolonii proslavilo indigo a později káva. Nezávislost 1821, po rozpadu Federace Střední Ameriky 1841 samostatná republika. Moc držela hrstka rodin pěstitelů kávy. Povstání rolníků 1932 armáda potlačila masakrem (La Matanza, desítky tisíc mrtvých). Fotbalová válka s Hondurasem 1969 trvala asi 100 hodin. Občanská válka 1980–1992 (zhruba 75 000 obětí) mezi vojenskou vládou a levicovým hnutím FMLN: 1980 byl zavražděn arcibiskup Óscar Romero, 1981 došlo k masakru v El Mozote. Mír 1992. Deportace členů losangeleských gangů z USA vedly ke vzniku MS-13 a Barrio 18; od 2022 platí výjimečný stav prezidenta Nayiba Bukeleho.",

h:"Před Španěly tu žili Nicarao (Nahuové, odtud jméno země) a Chorotegové; otisky chodidel z Acahualinca jsou staré přes 2 000 let. Španělé založili 1524 Granadu a León a Granadu pak opakovaně plenili piráti připlouvající z Karibiku. Nezávislost 1821. Americký dobrodruh William Walker se 1855 prohlásil prezidentem, obnovil otroctví a 1857 ho vyhnala koalice středoamerických států v čele s Kostarikou. V letech 1912–1933 zemi okupovala americká námořní pěchota; partyzán Augusto Sandino proti ní bojoval a 1934 byl zavražděn. Následovala dynastie Somozů (1936–1979), svržená sandinistickou revolucí. V 80. letech vedla vláda FSLN válku s Contras financovanými USA (aféra Írán–Contra), Daniel Ortega byl prezidentem 1985–1990. Po návratu k moci 2007 postupně upevnil vládu a po protestech 2018 (stovky mrtvých) potlačil opozici, nezávislá média a řadu občanských organizací.",

{k:"Kostarika",f:"🇨🇷",m:"colón (CRC), USD přijímán · 120 V, zásuvky A/B",
h:"Před Španěly zde nebyly velké říše, žily menší kmeny (Chorotegové, Huetarové, Bribri). Záhadou zůstávají kamenné koule kultury Diquís (UNESCO). Kolumbus doplul k pobřeží 1502 a pojmenoval zemi Bohaté pobřeží, ale zlata bylo málo a domorodá populace rychle klesla. Kolonie patřila k nejchudším v kapitánii Guatemala a kolonisté se živili prací na malých farmách, proto vznikla rovnostářštější společnost než jinde. V letech 1856–57 porazila armáda vedená Juanem Rafaelem Morou filibustera Williama Walkera (hrdina Juan Santamaría). Od 80. let 19. století rostla káva a banány (United Fruit, železnice ke Karibiku). Po krátké občanské válce 1948 José Figueres zrušil armádu (ústava 1949), zavedl volební právo žen i černošského obyvatelstva a peníze šly do školství a zdravotnictví. Óscar Arias získal 1987 Nobelovu cenu míru za mírový plán pro Střední Ameriku.",

{k:"Panama",f:"🇵🇦",m:"americký dolar (USD) · 120 V, zásuvky A/B",
h:"Vasco Núñez de Balboa překročil šíji 1513 a jako první Evropan spatřil Tichý oceán. Panama City (1519) se stalo výchozím bodem pro vývoz peruánského stříbra přes šíji do Portobela. Piráti, Drake i Henry Morgan, pevnosti a města plenili; Morgan 1671 vypálil první Panama City (Panamá Viejo). Panama patřila ke Kolumbii a 1821 se k ní připojila dobrovolně. Francouzi pod Ferdinandem de Lesseps, stavitelem Suezu, začali kanál 1881, ale kvůli žluté zimnici a malárii zahynulo asi 22 000 dělníků a projekt padl. USA převzaly stavbu, podpořily separatistické povstání a Panama se 3. 11. 1903 oddělila od Kolumbie. USA získaly pásmo průplavu, kanál byl otevřen 1914 (při stavbě zahynulo dalších asi 5 600 lidí). Nepokoje 1964 a smlouva Torrijos–Carter z roku 1977 vedly k předání kanálu Panamě 31. 12. 1999. Invaze USA 1989 svrhla generála Noriegu.",

{k:"Kolumbie",f:"🇨🇴",m:"peso (COP) · 110 V, zásuvky A/B",
h:"Na náhorní plošině kolem Bogoty žili Muiscové; obřad s pozlaceným náčelníkem v jezeře Guatavita dal vzniknout legendě o El Doradu. Na severu žili Tairona (Ciudad Perdida). Španělé založili Santa Martu 1525 a Cartagenu 1533, Gonzalo Jiménez de Quesada dobyl Muisky a 1538 založil Bogotu. Cartagena byla hlavním přístavem pro zlato a otroky a odolala útokům Drakea i admirála Vernona (1741). Simón Bolívar rozhodl o nezávislosti bitvou u Boyacá 1819 a vznikla Velká Kolumbie (dnešní Kolumbie, Venezuela, Ekvádor, Panama), která se rozpadla 1830. Následovaly občanské války liberálů a konzervativců včetně Války tisíce dnů (1899–1902) a ztráty Panamy 1903. Zavraždění Jorgeho Gaitána 1948 odstartovalo La Violencia (asi 200 000 mrtvých). Od 60. let bojovali partyzáni (FARC, ELN), v 80.–90. letech vládly kartely (Pablo Escobar, †1993). Mírová dohoda s FARC 2016 přinesla Nobelovu cenu míru prezidentu Santosovi, ale násilí v některých regionech trvá.",

{k:"Ekvádor",f:"🇪🇨",m:"americký dolar (USD) · 120 V, zásuvky A/B",
h:"Na pobřeží žila kultura Valdivia, jedna z nejstarších keramických kultur Ameriky (kolem 3500 př. n. l.), po ní Machalilla a Chorrera. Na vysočině vznikla konfederace Quitu-Cara a kolem dnešní Cuency žili Cañarové. Koncem 15. století zemi dobyli Inkové. Huayna Cápac pobýval v Quitu a jeho syn Atahualpa odtud vedl válku s bratrem Huáscarem. Španělé pod Sebastiánem de Benalcázarem dobyli Quito roku 1534 a město se stalo sídlem audiencie s barokními kostely tzv. quitské školy. První volání po nezávislosti zaznělo v Quitu 10. srpna 1809. Rozhodující bitvu na svazích Pichinchy vyhrál roku 1822 Antonio José de Sucre a země se stala součástí Velké Kolumbie. Samostatný Ekvádor vznikl roku 1830 a o dva roky později k němu připojil Galapágy, kde Charles Darwin roku 1835 sbíral poznatky pro teorii evoluce. Země vyvážela kakao, banány a od 70. let ropu. Po hluboké bankovní krizi přijala roku 2000 jako měnu americký dolar. Ústava z roku 2008 jako první na světě přiznala práva přírodě.",

{k:"Peru",f:"🇵🇪",m:"sol (PEN) · 220 V, zásuvky A/B/C",
h:"Nejstarší civilizace Ameriky, Caral (kolem 3000 př. n. l.), stála severně od Limy. Po ní následovaly Chavín, Paracas, Nazca (linie v poušti), Moche a Wari. Inkové vyrostli z Cusca na říši Tawantinsuyu: od 1438 za Pachacutekem ovládli území od dnešní Kolumbie po Chile s cestní sítí Qhapaq Ñan a záznamy vedli uzlovým písmem kipu. Po občanské válce bratrů Huáscara a Atahualpy a epidemii neštovic přistál 1532 Francisco Pizarro s asi 170 muži, v Cajamarce zajal Atahualpu, vzal výkupné (místnost plnou zlata) a 1533 ho popravil. Cusco padlo 1533, Lima (1535) se stala centrem místokrálovství. Inkové vedli odboj z Vilcabamby do roku 1572. Nezávislost vyhlásil San Martín 1821, definitivně rozhodla bitva u Ayacucha 1824. Ve Válce o Pacifik (1879–83) Peru prohrálo s Chile. V letech 1980–2000 sužovala zemi Světlá stezka (asi 70 000 obětí). Machu Picchu zpřístupnil světu 1911 Hiram Bingham.",

{k:"Bolívie",f:"🇧🇴",m:"boliviano (BOB) · 230 V, zásuvky A/C",
h:"Altiplano bylo kolébkou Tiwanaku (zhruba 500–1000 n. l.), významného centra u jezera Titicaca. Poté tu vládli Aymarové a od 15. století Inkové. Roku 1545 objevili Španělé obří stříbrné ložisko v Cerro Rico u Potosí. Město vyrostlo mezi největší na světě (kolem 1650 asi 160 000 lidí) a stříbro financovalo Španělsko. Těžili domorodí dělníci v nuceném systému mita a později dovezení otroci, zemřely statisíce lidí. Povstání Túpaca Katariho oblehlo 1781 La Paz. Nezávislost 1825, jméno země podle Bolívara a prvním prezidentem byl Sucre. Bolívie pak ztratila velká území: ve Válce o Pacifik (1879–83) pobřeží s Atacamou Chile, 1903 Acre Brazílii a ve válce o Chaco (1932–35) velkou část Chaca Paraguayi. Revoluce 1952 znárodnila doly a zavedla všeobecné volební právo. Che Guevara zde 1967 zahynul. Vojenské vlády skončily 1982. Evo Morales, první domorodý prezident (2006–2019), přejmenoval zemi na Plurinárodní stát (ústava 2009). Země dodnes usiluje o přístup k moři.",

{k:"Chile",f:"🇨🇱",m:"peso (CLP) · 220 V, zásuvky C/L",
h:"Na jihu žili Mapučové (Araukáni), které nepodrobili ani Inkové a dlouho ani Španělé. Pedro de Valdivia založil Santiago 1541, ale válka v Arauco trvala přes 300 let. Chile bylo okrajovou kolonií. První junta vznikla 1810, nezávislost vyhlásil 1818 Bernardo O'Higgins po vítězstvích armády San Martína u Chacabuca a Maipú. Ve 19. století nastoupila stabilní oligarchická republika. Válka o Pacifik (1879–83) s Peru a Bolívií dala Chile ložiska ledku v Atacamě a zvětšila území, Bolívie přišla o moře. Později rostl význam mědi. V roce 1970 byl zvolen socialista Salvador Allende, 11. 9. 1973 ho svrhl vojenský převrat generála Augusta Pinocheta (bombardování paláce La Moneda). Diktatura do 1990 měla tisíce zavražděných a zmizelých a desítky tisíc mučených, ekonomické reformy provedli Chicago boys. Referendum 1988 ukončilo Pinochetovu vládu. V roce 2010 se podařilo zachránit 33 horníků z Copiapó. Protesty 2019 vedly k pokusům o novou ústavu, oba návrhy (2022, 2023) ale voliči odmítli.",

const PHL={};
function resizeImg(file,max=1400,q=.78){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');
      c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      let d=c.toDataURL('image/jpeg',q);
      if(d.length>1.4e6)d=c.toDataURL('image/jpeg',.6);
      res(d);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('obrázek'))};
    img.src=url;
  });
}

/* ================= POLOHA PODLE NÁZVU (Open-Meteo Geocoding) ================= */
const ISO2={'Mexiko':'MX','Guatemala':'GT','Belize':'BZ','Salvador':'SV','Honduras':'HN','Nikaragua':'NI','Kostarika':'CR','Panama':'PA','Kolumbie':'CO','Ekvádor':'EC','Peru':'PE','Bolívie':'BO','Chile':'CL','Argentina':'AR','Paraguay':'PY','Uruguay':'UY','Brazílie':'BR'};
/* přednost má přesný název; ze stejnojmenných obcí v zemi vyhraje blízká k bodu z mapy (do 500 km) a větší před malou vesnicí, jinak ta největší */
async function geocode(name,country,near){
  const cc=ISO2[country];
  try{
    const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=20&language=cs&format=json${cc?'&countryCode='+cc:''}`);
    if(!r.ok)return null;
    const res=((await r.json()).results||[]).filter(x=>!cc||x.country_code===cc);
    if(!res.length)return null;
    const exact=res.filter(x=>norm(x.name)===norm(name)),pool=exact.length?exact:res;
    const towns=pool.filter(x=>/^PPL/.test(x.feature_code||'')),list=towns.length?towns:pool;
    const dist=x=>near&&near.lat!=null?km(near,{lat:x.latitude,lon:x.longitude}):Infinity;
    const score=x=>dist(x)-30*Math.log10((x.population||0)+10);
    const close=list.filter(x=>dist(x)<=500).sort((a,b)=>score(a)-score(b));
    const g=close[0]||list.slice().sort((a,b)=>(b.population||0)-(a.population||0))[0];
    return {lat:+g.latitude.toFixed(2),lon:+g.longitude.toFixed(2),label:[g.name,g.admin1,g.country].filter(Boolean).join(', ')};
  }catch(e){return null}
}

/* ================= GEOMETRIE MAPY ================= */
const W0=516,H0=534;
const X=lon=>(lon+118)*6,Y=lat=>(33-lat)*6;
const pts=a=>a.map(p=>X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join(" ");
function ptIn(r,lon,lat){let c=false;for(let i=0,j=r.length-2;i<r.length;j=i,i+=2){const xi=r[i],yi=r[i+1],xj=r[j],yj=r[j+1];if((yi>lat)!==(yj>lat)&&lon<(xj-xi)*(lat-yi)/(yj-yi)+xi)c=!c}return c}
function segD(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(ax+t*dx-px,ay+t*dy-py)}
function countryAt(lon,lat){
  for(let g=0;g<GEO.length;g++)for(const r of GEO[g].r)if(ptIn(r,lon,lat))return g;
  let best=-1,bd=1.5;
  GEO.forEach((G,g)=>G.r.forEach(r=>{for(let i=0,j=r.length-2;i<r.length;j=i,i+=2){const d=segD(lon,lat,r[j],r[j+1],r[i],r[i+1]);if(d<bd){bd=d;best=g}}}));
  return best;
}
const CC=new Map();
function ctryIdx(s){const k=s.lat+','+s.lon;if(!CC.has(k))CC.set(k,countryAt(s.lon,s.lat));return CC.get(k)}
const km=(a,b)=>{const t=x=>x*Math.PI/180,dl=t(b.lat-a.lat),dn=t(b.lon-a.lon),q=Math.sin(dl/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dn/2)**2;return 2*6371*Math.asin(Math.sqrt(q))};
function routeKm(){let tot=0,done=0;const ci=curIdx();for(let i=1;i<S.stops.length;i++){const d=km(S.stops[i-1],S.stops[i]);tot+=d;if(i<=ci)done+=d}return{tot,done}}
const col=i=>i<curIdx()?'var(--done)':i===curIdx()?'var(--now)':'var(--next)';

}

/* ================= 3D GLÓBUS ================= */
const D=Math.PI/180;
const G={lon:-75,lat:-8,z:1,drag:null,pinch:null,ptr:new Map(),auto:!RM,raf:0,resume:0,col:null,w:null};
/* mapa světa mimo Ameriku (svet.json, Natural Earth 1:110m); Amerika se kreslí podrobněji z GEO */
function globeWorld(){if(G.w)return;G.w=[];fetch('svet.json').then(r=>r.json()).then(j=>{G.w=j}).catch(()=>{G.w=null})}
const globeZoom=f=>{G.z=Math.max(1,Math.min(8,G.z*f))};
function globeColors(){
  const s=getComputedStyle(document.documentElement),g=n=>s.getPropertyValue(n).trim()||'#888';
  G.col={sea:g('--sea'),land:g('--land'),landS:g('--land-s'),acc:g('--acc'),now:g('--now'),done:g('--done'),next:g('--next'),tx:g('--tx'),p2:g('--panel2')};
}
function globeInit(){
  const cv=$('globe');if(!cv)return;
  globeWorld();G.ptr.clear();G.drag=G.pinch=null;
  const dist=()=>{const [a,b]=[...G.ptr.values()];return Math.hypot(a.x-b.x,a.y-b.y)||1};
  const grab=()=>{const p=[...G.ptr.values()][0];G.drag=p?{x:p.x,y:p.y,lon:G.lon,lat:G.lat}:null};
  cv.addEventListener('pointerdown',e=>{G.ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});G.auto=false;clearTimeout(G.resume);try{cv.setPointerCapture(e.pointerId)}catch(_){}
    if(G.ptr.size===2){G.drag=null;G.pinch={d:dist(),z:G.z}}else if(G.ptr.size===1)grab()});
  cv.addEventListener('pointermove',e=>{if(!G.ptr.has(e.pointerId))return;G.ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(G.pinch&&G.ptr.size>=2){G.z=Math.max(1,Math.min(8,G.pinch.z*dist()/G.pinch.d));return}
    if(!G.drag)return;const k=.35/G.z;G.lon=G.drag.lon-(e.clientX-G.drag.x)*k;G.lat=Math.max(-85,Math.min(85,G.drag.lat+(e.clientY-G.drag.y)*k))});
  const up=e=>{G.ptr.delete(e.pointerId);if(G.ptr.size<2)G.pinch=null;if(G.ptr.size===1)grab();if(G.ptr.size)return;
    G.drag=null;clearTimeout(G.resume);G.resume=setTimeout(()=>{G.auto=!RM},4000)};
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  cv.addEventListener('wheel',e=>{e.preventDefault();globeZoom(Math.exp(-e.deltaY*.0015));G.auto=false;clearTimeout(G.resume);G.resume=setTimeout(()=>{G.auto=!RM},4000)},{passive:false});
  cv.addEventListener('dblclick',()=>globeZoom(1.6));
}
function globeStart(){globeColors();if(!G.raf)G.raf=requestAnimationFrame(globeFrame)}
function globeFrame(ts){G.raf=0;if(view!=='home'||!$('globe'))return;drawGlobe(ts);G.raf=requestAnimationFrame(globeFrame)}
const vec=(lon,lat)=>[Math.cos(lat*D)*Math.cos(lon*D),Math.cos(lat*D)*Math.sin(lon*D),Math.sin(lat*D)];
function gcPts(a,b,n){
  const va=vec(a.lon,a.lat),vb=vec(b.lon,b.lat),dot=Math.max(-1,Math.min(1,va[0]*vb[0]+va[1]*vb[1]+va[2]*vb[2])),om=Math.acos(dot),so=Math.sin(om)||1,out=[];
  for(let k=0;k<=n;k++){const t=k/n,f1=Math.sin((1-t)*om)/so,f2=Math.sin(t*om)/so,v=[f1*va[0]+f2*vb[0],f1*va[1]+f2*vb[1],f1*va[2]+f2*vb[2]];out.push({lat:Math.asin(Math.max(-1,Math.min(1,v[2])))/D,lon:Math.atan2(v[1],v[0])/D,t,om})}
  return out;
}
function drawGlobe(ts){
  const cv=$('globe'),ctx=cv&&cv.getContext&&cv.getContext('2d');if(!ctx||!G.col)return;
  const C=G.col,dpr=Math.min(2,window.devicePixelRatio||1),w=cv.clientWidth||360;
  if(cv.width!==Math.round(w*dpr))cv.width=cv.height=Math.round(w*dpr);
  const N=cv.width,R=N*.42*G.z,cx=N/2,cy=N/2,cur=curStop(),ci=curIdx();
  if(G.auto&&!G.drag){G.lon+=((cur.lon+Math.sin(ts/4500)*16/G.z)-G.lon)*.02;G.lat+=((Math.max(-30,Math.min(20,cur.lat*.6)))-G.lat)*.02}
  const l0=G.lon*D,p0=G.lat*D,sp0=Math.sin(p0),cp0=Math.cos(p0);
  const P3=(lon,lat,rr=1)=>{const l=lon*D-l0,p=lat*D,sp=Math.sin(p),cp=Math.cos(p),cl=Math.cos(l);return{x:cx+cp*Math.sin(l)*R*rr,y:cy-(cp0*sp-sp0*cp*cl)*R*rr,c:sp0*sp+cp0*cp*cl}};
  ctx.clearRect(0,0,N,N);
  ctx.fillStyle=C.sea;ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.fill();
  ctx.save();ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.clip();
  /* souřadnicová síť */
  ctx.strokeStyle=C.tx;ctx.globalAlpha=.07;ctx.lineWidth=1;
  const ln=(f)=>{ctx.beginPath();let pen=false;for(let k=0;k<=72;k++){const q=f(k/72),p=P3(q[0],q[1]);if(p.c>0){pen?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y);pen=true}else pen=false}ctx.stroke()};
  for(let la=-60;la<=60;la+=20)ln(t=>[-180+360*t,la]);
  for(let lo=-180;lo<180;lo+=20)ln(t=>[lo,-80+160*t]);
  ctx.globalAlpha=1;
  /* země */
  const shape=c=>{ctx.beginPath();let vis=false;
    c.r.forEach(r=>{for(let i=0;i<r.length;i+=2){let p=P3(r[i],r[i+1]);if(p.c>0)vis=true;else{let dx=p.x-cx,dy=p.y-cy,len=Math.hypot(dx,dy)||1;p={x:cx+dx/len*R,y:cy+dy/len*R}}i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)}ctx.closePath()});
    return vis};
  if(G.w)G.w.forEach(c=>{if(!shape(c))return;ctx.fillStyle=C.land;ctx.fill();ctx.strokeStyle=C.landS;ctx.lineWidth=.6*dpr;ctx.stroke()});
  const st=ctryStatus();
  GEO.forEach((c,gi)=>{
    if(c.n==='USA'||c.n==='Falklandy')return;
    if(!shape(c))return;
    ctx.fillStyle=C.land;ctx.fill();
    const s=st[gi];if(s){ctx.globalAlpha=s==='now'?.5:s==='done'?.4:.2;ctx.fillStyle=s==='now'?C.now:s==='done'?C.done:C.acc;ctx.fill();ctx.globalAlpha=1}
    ctx.strokeStyle=C.landS;ctx.lineWidth=.8*dpr;ctx.stroke();
  });
  /* trasa (velké kruhy), animace */
  const stops=S.stops;
  for(let i=1;i<stops.length;i++){
    const pts=gcPts(stops[i-1],stops[i],28),done=i<=ci;
    ctx.beginPath();let pen=false;
    pts.forEach(q=>{const p=P3(q.lon,q.lat,1+Math.sin(Math.PI*q.t)*Math.min(.1,q.om*.1));if(p.c>0.02){pen?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y);pen=true}else pen=false});
    if(done){ctx.strokeStyle=C.done;ctx.lineWidth=2.8*dpr;ctx.shadowBlur=0;ctx.setLineDash([])}
    else{ctx.strokeStyle=C.next;ctx.lineWidth=1.6*dpr;ctx.shadowBlur=0;ctx.setLineDash([4*dpr,5*dpr]);ctx.lineDashOffset=-ts/60}
    ctx.stroke();ctx.shadowBlur=0;ctx.setLineDash([]);
  }
  if(ci>0){

    const p=P3(s.lon,s.lat);if(p.c<0.03)return;

    if(i===ci){
      ctx.strokeStyle=C.now;ctx.globalAlpha=.55;ctx.lineWidth=1.6*dpr;ctx.beginPath();ctx.arc(p.x,p.y,(9+4*Math.sin(ts/300))*dpr,0,7);ctx.stroke();ctx.globalAlpha=1;
      ctx.font=`700 ${13*dpr}px Figtree,system-ui,sans-serif`;ctx.fillStyle=C.tx;ctx.textAlign='left';ctx.lineWidth=3*dpr;ctx.strokeStyle=C.land;ctx.lineJoin='round';ctx.strokeText(s.n,p.x+13*dpr,p.y-10*dpr);ctx.fillText(s.n,p.x+13*dpr,p.y-10*dpr);

/* ================= GRAFY ================= */
const czkS=n=>n>=1e6?(n/1e6).toFixed(1).replace('.',',')+' M':n>=1e4?Math.round(n/1e3)+' tis.':Math.round(n).toLocaleString('cs-CZ');
function combo({labels,sub,max,min,rain,rainMax}){
  const W=560,H=246,pl=36,pr=12,pt=16,pb=42,iw=W-pl-pr,ih=H-pt-pb,n=labels.length;
  const lo=Math.floor((Math.min(...min)-2)/5)*5,hi=Math.ceil((Math.max(...max)+2)/5)*5,rm=rainMax||Math.max(10,...rain);
  const x=i=>pl+iw*(i+.5)/n,y=t=>pt+ih*(1-(t-lo)/(hi-lo));
  let s=`<svg class="ch" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Graf teplot a srážek">`;
  for(let t=lo;t<=hi;t+=5)s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(t)+3}" text-anchor="end">${t}°</text>`;
  rain.forEach((r,i)=>{const h=Math.max(0,r/rm)*ih*.38;s+=`<rect x="${x(i)-iw/n*.22}" y="${pt+ih-h}" width="${iw/n*.44}" height="${h}" rx="3" fill="var(--cool)" opacity=".28"/>`});
  const path=a=>a.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join('');
  s+=`<path d="${path(max)}" fill="none" stroke="var(--peach)" stroke-width="2.2" stroke-linejoin="round"/><path d="${path(min)}" fill="none" stroke="var(--cool)" stroke-width="2.2" stroke-linejoin="round"/>`;
  max.forEach((v,i)=>s+=`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="var(--peach)"/><text x="${x(i)}" y="${y(v)-8}" text-anchor="middle" style="fill:var(--tx)">${Math.round(v)}°</text>`);
  min.forEach((v,i)=>s+=`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="var(--cool)"/><text x="${x(i)}" y="${y(v)+15}" text-anchor="middle">${Math.round(v)}°</text>`);
  labels.forEach((l,i)=>s+=`<text x="${x(i)}" y="${H-24}" text-anchor="middle" style="fill:var(--tx)">${esc(l)}</text><text x="${x(i)}" y="${H-10}" text-anchor="middle">${esc(sub[i])}</text>`);
  return s+'</svg><div class="legendc"><span><i class="dot" style="background:var(--peach)"></i>max °C</span><span><i class="dot" style="background:var(--cool)"></i>min °C</span><span><i class="dot" style="background:var(--cool);opacity:.4"></i>srážky (mm)</span></div>';
}
function donut(data,total){
  const R=52,Cc=2*Math.PI*R;let off=0;
  let s=`<svg class="ch" viewBox="0 0 140 140" width="150" height="150" role="img" aria-label="Výdaje podle kategorií"><circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--line)" stroke-width="16"/>`;
  data.forEach(([l,v],i)=>{const len=Cc*v/total;s+=`<circle cx="70" cy="70" r="${R}" fill="none" stroke="${PAL[i%PAL.length]}" stroke-width="16" stroke-dasharray="${len} ${Cc-len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=len});
  return s+`<text x="70" y="68" text-anchor="middle" style="fill:var(--tx);font-size:12px;font-weight:700">${czkS(total)}</text><text x="70" y="82" text-anchor="middle">Kč celkem</text></svg>`;
}
/* popisek osy: 0, 950, 3,2 tis., 13 tis. */
const axK=v=>v<1e3?String(Math.round(v)):v<1e4?(v/1e3).toFixed(1).replace('.',',').replace(',0','')+' tis.':czkS(v);
function areaChart(points,limit){
  const W=560,H=200,pl=68,pr=14,pt=14,pb=26,iw=W-pl-pr,ih=H-pt-pb,n=points.length;
  const mx=Math.max(limit||0,...points.map(p=>p[1]),1),x=i=>pl+(n===1?iw/2:iw*i/(n-1)),y=v=>pt+ih*(1-v/mx);
  let s=`<svg class="ch" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Kumulativní výdaje"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--acc)" stop-opacity=".35"/><stop offset="1" stop-color="var(--acc)" stop-opacity="0"/></linearGradient></defs>`;
  for(let k=0;k<=4;k++){const v=mx*k/4;s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-8}" y="${y(v)+3}" text-anchor="end">${axK(v)}</text>`}

const VB={x:0,y:0,w:W0,h:H0};
const zoomLvl=()=>W0/VB.w;
const setVB=()=>{const m=$('map');if(m)m.setAttribute('viewBox',`${VB.x} ${VB.y} ${VB.w} ${VB.h}`)};
function clampVB(){VB.x=Math.min(Math.max(VB.x,-20),W0-VB.w+20);VB.y=Math.min(Math.max(VB.y,-20),H0-VB.h+20)}
function toSvg(cx,cy){const s=$('map'),p=s.createSVGPoint();p.x=cx;p.y=cy;return p.matrixTransform(s.getScreenCTM().inverse())}
function zoomAt(f,cx,cy){
  const nz=Math.min(14,Math.max(1,zoomLvl()*f)),nw=W0/nz,nh=H0/nz;
  VB.x=cx-(cx-VB.x)*nw/VB.w;VB.y=cy-(cy-VB.y)*nh/VB.h;VB.w=nw;VB.h=nh;clampVB();setVB();drawOverlay();
}
function centerOn(lon,lat){VB.x=X(lon)-VB.w/2;VB.y=Y(lat)-VB.h/2;clampVB();setVB()}
function focusOn(lon,lat,zz){VB.w=W0/zz;VB.h=H0/zz;centerOn(lon,lat);drawOverlay()}
function fitRoute(){
  const xs=S.stops.map(p=>X(p.lon)),ys=S.stops.map(p=>Y(p.lat));
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const zz=Math.min(14,Math.max(1,Math.min(W0/(x1-x0+70),H0/(y1-y0+70))));
  VB.w=W0/zz;VB.h=H0/zz;VB.x=(x0+x1)/2-VB.w/2;VB.y=(y0+y1)/2-VB.h/2;clampVB();setVB();drawOverlay();
}
let routeG=new Set(),trasaBuilt=false;

const ptrs=new Map();let drag=null,moved=false,pinch=null;
function initMap(){
  const svg=$('map');
  svg.addEventListener('pointerdown',e=>{
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;
    if(ptrs.size===1)drag={x:e.clientX,y:e.clientY,vx:VB.x,vy:VB.y};
    if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:zoomLvl()};drag=null;moved=true}
  });
  svg.addEventListener('pointermove',e=>{
    if(!ptrs.has(e.pointerId))return;
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size===2&&pinch){const [a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y),m=toSvg((a.x+b.x)/2,(a.y+b.y)/2);zoomAt(pinch.z*d/pinch.d/zoomLvl(),m.x,m.y);return}
    if(drag){
      const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
      if(!moved){if(Math.hypot(dx,dy)<6)return;moved=true;try{svg.setPointerCapture(e.pointerId)}catch(_){}}
      const k=VB.w/svg.getBoundingClientRect().width;
      VB.x=drag.vx-dx*k;VB.y=drag.vy-dy*k;clampVB();setVB();
    }
  });
  const up=e=>{
    ptrs.delete(e.pointerId);
    if(ptrs.size<2)pinch=null;
    if(ptrs.size===0)drag=null;
    else if(ptrs.size===1){const p=[...ptrs.values()][0];drag={x:p.x,y:p.y,vx:VB.x,vy:VB.y}}
  };
  svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
  svg.addEventListener('wheel',e=>{e.preventDefault();const p=toSvg(e.clientX,e.clientY);zoomAt(e.deltaY<0?1.25:0.8,p.x,p.y)},{passive:false});
  svg.addEventListener('click',e=>{
    if(moved){moved=false;return}
    const g=e.target.closest('.pin');
    if(!mode){if(g){sel=g.dataset.id;refresh()}return}
    const p=toSvg(e.clientX,e.clientY),lon=+(p.x/6-118).toFixed(2),lat=+(33-p.y/6).toFixed(2);
    const gi=countryAt(lon,lat),cn=gi>=0?GEO[gi].n:'';
    if(mode==='add')form={kind:'new',d:{n:'',c:cn,a:'',o:'',t:'',tm:'',tt:'',lat,lon}};
    else{const s=S.stops[idx(sel)];s.lat=lat;s.lon=lon;s.pin='man';if(cn)s.c=cn;mark('pub')}
    mode=null;refresh();
  });
}

/* klima nejbližšího místa s údaji, přednostně ve stejné zemi */
function climateOf(s){
  const all=Object.entries(WX).flatMap(([c,l])=>l.map(([loc,v])=>({c,loc,v,ll:WXLL[loc]}))),same=all.filter(a=>a.c===s.c);
  if(!same.length&&s.lat==null)return null;
  const dist=a=>a.ll&&s.lat!=null?Math.hypot(a.ll[0]-s.lat,(a.ll[1]-s.lon)*Math.cos(s.lat*Math.PI/180)):1e9;
  return (same.length?same:all).slice().sort((a,b)=>dist(a)-dist(b))[0];
}

/* ================= ROZPOČET ================= */
let bTab='zeme';
function vRozpocet(){
  const ex=P.expenses,conv=e=>e.amt*rate(e.cur),spent=ex.reduce((a,e)=>a+conv(e),0),lim=+P.total||0;
  const group=key=>{const m={};ex.forEach(e=>{const k=e[key]||'Ostatní';m[k]=(m[k]||0)+conv(e)});return Object.entries(m).sort((a,b)=>b[1]-a[1])};
  /* denní průměr v zemi (od prvního do posledního výdaje) proti plánu z ZX, převedenému z USD */
  const dates=c=>ex.filter(e=>(e.country||'Ostatní')===c&&e.date).map(e=>e.date).sort(),days=c=>{const d=dates(c);return d.length?diffDays(d[0],d[d.length-1])+1:0};
  const plan=c=>{const m=((ZX[c]||{}).bd||'').match(/(\d+)–(\d+)/);return m?[m[1]*rate('USD'),m[2]*rate('USD')]:null};
  const dny=d=>d===1?'den':d<5?'dny':'dní';
  const perDay=(k,v)=>{const d=days(k),pd=d?v/d:0,pl=plan(k);if(!d)return '';const st=pl?pd>pl[1]?['bad','nad plánem']:pd<pl[0]?['ok','pod plánem']:['','v plánu']:null;
    return `<div class="bsub lab">${czk(pd)} za den · ${d} ${dny(d)}${pl?` · plán ${czkS(pl[0])}–${czk(pl[1])} · <b style="color:var(--${st[0]||'tx'})">${st[1]}</b>`:''}</div>`};
  const bars=(g,isC)=>g.length?g.map(([k,v])=>{const p=spent?Math.round(v/spent*100):0;return `<div class="bar"><span>${isC?flag(k,18)+' ':''}${esc(k)}</span><div class="w"><i style="width:${p}%"></i></div><b class="mono" style="font-size:.8rem">${czk(v)}</b><em>${p} %</em></div>${isC?perDay(k,v):''}`}).join(''):'<p class="note">Zatím žádné výdaje.</p>';
  const cc=curCountry(),countries=[...new Set(S.stops.map(s=>s.c).filter(Boolean))];
  const list=[...ex].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const kat=group('cat'),byDate={};ex.forEach(e=>{byDate[e.date]=(byDate[e.date]||0)+conv(e)});
  const all=ex.map(e=>e.date).filter(Boolean).sort(),tripDays=all.length?diffDays(all[0],todayISO())+1:0;
  let run=0;const cum=Object.keys(byDate).sort().map(d=>[d,run+=byDate[d]]);
  const body=bTab==='zeme'?bars(group('country'),true):bTab==='kat'?(kat.length?`<div class="row" style="gap:18px;align-items:center">${donut(kat,spent)}<div style="flex:1;min-width:160px">${kat.map(([k,v],i)=>`<div class="row" style="justify-content:space-between;font-size:.86rem;margin:4px 0"><span><i class="dot" style="background:${PAL[i%PAL.length]}"></i>${esc(k)}</span><b class="mono">${czk(v)}</b></div>`).join('')}</div></div>`:'<p class="note">Zatím žádné výdaje.</p>'):
   (list.length?list.map(e=>`<div class="item"><div class="t"><b>${esc(e.note||e.cat)}</b><br><small>${fd(e.date)} · ${esc(e.country)} · ${esc(e.cat)}</small></div><div style="text-align:right"><b class="mono">${e.amt.toLocaleString('cs-CZ')} ${esc(e.cur)}</b>${e.cur!=='CZK'?`<br><small>≈ ${czk(conv(e))}</small>`:''}</div>${edit?`<button class="x" data-act="expdel" data-id="${e.id}" aria-label="Smazat">${ico('x',16)}</button>`:''}</div>`).join(''):'<p class="note">Zatím žádné výdaje.</p>');
  $('v-rozpocet').innerHTML=pageHead('Rozpočet','Výdaje na cestě v přepočtu na Kč')+
   `<div class="card"><h3>Celkem utraceno</h3><div class="mono" style="font-size:2rem;font-weight:600;color:var(--acc)">${czk(spent)}</div>${tripDays>0?`<div class="lab" style="margin-top:2px">průměrně ${czk(spent/tripDays)} za den · ${tripDays} ${dny(tripDays)} od prvního výdaje</div>`:''}
    ${lim?`<div class="prog ${spent>lim?'bad':spent>lim*.85?'warn':''}" style="margin:10px 0 6px"><i style="width:${Math.min(100,spent/lim*100)}%"></i></div><div class="lab">z ${czk(lim)} · zbývá ${czk(lim-spent)} · ${Math.round(spent/lim*100)} %</div>`:edit?'<p class="note">Nastav celkový rozpočet níže.</p>':''}
    ${edit?`<div class="row" style="margin-top:12px"><input id="blim" type="number" min="0" class="grow" placeholder="Celkový rozpočet (Kč)" value="${lim||''}"><button class="btn sm" data-act="blim">Uložit</button></div>`:''}</div>
   ${cum.length?`<div class="card"><h3>Vývoj výdajů</h3>${areaChart(cum,lim)}</div>`:''}
   <div class="card">${seg([['zeme','Po zemích'],['kat','Kategorie'],['seznam','Výdaje']],bTab,'btab')}${body}</div>
   ${edit?`<div class="card"><h3>Přidat výdaj</h3><div class="form">
    <div class="row"><div class="grow"><label class="l">Datum</label><input id="ed" type="date" value="${todayISO()}"></div><div class="grow"><label class="l">Země</label><select id="ec" data-chg="ecsel">${countries.map(c=>`<option${c===cc?' selected':''}>${esc(c)}</option>`).join('')}<option>Ostatní</option></select></div></div>
    <div class="row"><div class="grow"><label class="l">Kategorie</label><select id="ek">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></div><div class="grow"><label class="l">Částka</label><input id="ea" type="number" step="0.01" min="0"></div><div class="grow"><label class="l">Měna</label><select id="ecu">${CUR.map(([c])=>`<option${c===(CCUR[cc]||'CZK')?' selected':''}>${c}</option>`).join('')}</select></div></div>
    <label class="l">Poznámka</label><input id="en" placeholder="např. večeře, autobus…">
    <div class="row" style="margin-top:10px"><button class="btn pri" data-act="expadd">Přidat výdaj</button></div></div>
    <p class="note" style="margin:10px 0 0">Kurzy upravíš v Nastavení. Výdaje vidí po uložení i návštěvníci stránky (jen ke čtení).</p></div>`:''}`;
}

  otab:t=>{oTab=t.dataset.k;refresh()},
  calprev:()=>{const [y,m]=calM.split('-').map(Number),d=new Date(y,m-2,1);calM=d.getFullYear()+'-'+pad2(d.getMonth()+1);refresh()},
  calnext:()=>{const [y,m]=calM.split('-').map(Number),d=new Date(y,m,1);calM=d.getFullYear()+'-'+pad2(d.getMonth()+1);refresh()},
  calsel:t=>{calSel=t.dataset.d;refresh()},
  fsel:t=>{fSel=t.dataset.k;refresh()},
  lb:t=>{const b=$('lb');b.innerHTML=`<img src="${esc(t.dataset.src)}" alt=""><p>${esc(t.dataset.cap||'')}</p>`;b.classList.remove('hide');b.setAttribute('tabindex','-1');b.focus()},
  lbclose:()=>$('lb').classList.add('hide'),
  zi:()=>zoomAt(1.6,VB.x+VB.w/2,VB.y+VB.h/2),
  zo:()=>zoomAt(1/1.6,VB.x+VB.w/2,VB.y+VB.h/2),
  zh:()=>{const s=curStop();focusOn(s.lon,s.lat,5)},
  zr:()=>fitRoute(),
  gzi:()=>globeZoom(1.6),
  gzo:()=>globeZoom(1/1.6),
  sel:t=>{sel=t.dataset.id;const s=stopOf();if(zoomLvl()>1.2)centerOn(s.lon,s.lat);refresh()},
  dtab:t=>{dTab=t.dataset.k;refresh()},
  addmode:()=>{mode='add';form=null;refresh()},
  cancelmode:()=>{mode=null;refresh()},
  move:()=>{mode='move';refresh()},
  here:()=>{S.cur=sel;S.upd=Date.now();mark('pub');refresh()},
  edit:()=>{form={kind:'edit',d:{...stopOf()}};refresh()},
  up:()=>{const i=idx(sel);if(i>0){[S.stops[i-1],S.stops[i]]=[S.stops[i],S.stops[i-1]];mark('pub');refresh()}},
  down:()=>{const i=idx(sel);if(i<S.stops.length-1){[S.stops[i+1],S.stops[i]]=[S.stops[i],S.stops[i+1]];mark('pub');refresh()}},
  del:()=>{
    const i=idx(sel);if(S.stops.length<2||!confirm('Smazat zastávku „'+S.stops[i].n+'“?'))return;
    const id=S.stops[i].id;S.stops.splice(i,1);S.diary=S.diary.filter(d=>d.sid!==id);S.places=S.places.filter(p=>p.sid!==id);S.photos=S.photos.filter(p=>p.sid!==id);
    sel=S.stops[Math.max(0,i-1)].id;if(idx(S.cur)<0){S.cur=sel;S.upd=Date.now()}mark('pub');refresh();
  },
  formno:()=>{form=null;refresh()},
  formok:async()=>{
    if(!form||form.busy)return;
    const f=form,d=f.d,old=f.kind==='edit'?S.stops[idx(d.id)]:null;d.n=$('fn').value.trim()||'Bez názvu';d.c=$('fc').value.trim();d.a=$('fa').value;d.o=$('fo').value;d.t=$('ft').value.trim();d.tm=$('ftm').value;d.tt=$('ftt').value.trim();
    /* poloha podle názvu; ručně přesunutý bod se nepřepisuje, dokud se nezmění název nebo země */
    let msg='';
    if(!old||old.pin!=='man'||old.n!==d.n||old.c!==d.c){
      f.busy=true;fabMsg='Hledám polohu…';fab();
      const g=await geocode(d.n,d.c,d);f.busy=false;
      if(form!==f)return;
      if(g){d.lat=g.lat;d.lon=g.lon;d.pin=undefined;msg='Poloha: '+g.label+' – ulož a zveřejni'}
      else msg='„'+d.n+'“ jsem nenašel – zůstává bod z mapy';
    }
    if(f.kind==='new'){d.id='s'+uid();S.stops.splice(idx(sel)+1,0,d);sel=d.id}else Object.assign(S.stops[idx(d.id)],d);
    form=null;mark('pub');fabMsg=msg;refresh();fab();
  },
  diaryadd:()=>{const v=$('dtext').value.trim();if(!v)return;S.diary.push({id:'d'+uid(),sid:sel,date:todayISO(),text:v});mark('pub');refresh()},
  homediary:()=>{const v=$('hdtext').value.trim();if(!v)return;S.diary.push({id:'d'+uid(),sid:S.cur,date:todayISO(),text:v});mark('pub');fabMsg='Zápis přidán – ulož a zveřejni';refresh()},
  diarydel:t=>{S.diary=S.diary.filter(d=>d.id!==t.dataset.id);mark('pub');refresh()},
  placeadd:()=>{const n=$('pln').value.trim();if(!n)return;S.places.push({id:'m'+uid(),sid:sel,type:$('plt').value,name:n,note:$('plo').value.trim(),url:$('plu').value.trim()});mark('pub');refresh()},
  placerec:t=>{const s=stopOf(),i=INFO.find(c=>c.k===s.c);if(!i)return;S.places.push({id:'m'+uid(),sid:sel,type:'Zajímavost',name:i.top[+t.dataset.i],note:'',url:''});mark('pub');refresh()},
  placedel:t=>{S.places=S.places.filter(p=>p.id!==t.dataset.id);mark('pub');refresh()},
  photoadd:async()=>{
    const f=$('pf')&&$('pf').files[0];if(!f){fabMsg='Vyber nejdřív fotku';fab();return}
    fabMsg='Nahrávám fotku…';fab();
    try{await addPhoto(f,$('ps').value,$('pc').value.trim());fabMsg='Fotka nahrána – ulož a zveřejni'}catch(e){fabMsg='Nahrání selhalo ('+e.message+')'}
    refresh();
  },
  photodel:async t=>{
    if(!confirm('Smazat fotku?'))return;
    const p=S.photos.find(x=>x.id===t.dataset.id);S.photos=S.photos.filter(x=>x.id!==t.dataset.id);mark('pub');refresh();
    if(p&&TOKEN)try{await ghDelete(GH.repo,p.f)}catch(e){}
  },
  save:()=>saveAll(),
  btab:t=>{bTab=t.dataset.k;refresh()},
  blim:()=>{P.total=+$('blim').value||0;mark('priv');refresh()},
  expadd:()=>{const a=parseFloat($('ea').value);if(!(a>0))return;P.expenses.push({id:'e'+uid(),date:$('ed').value||todayISO(),country:$('ec').value,cat:$('ek').value,amt:a,cur:$('ecu').value,note:$('en').value.trim()});mark('priv');refresh()},
  expdel:t=>{P.expenses=P.expenses.filter(e=>e.id!==t.dataset.id);mark('priv');refresh()},
  ptab:t=>{pTab=t.dataset.k;refresh()},
  bfil:t=>{bFil=t.dataset.k;refresh()},
  taskadd:()=>{const v=$('tt').value.trim();if(!v)return;P.tasks.push({id:'t'+uid(),t:v,due:$('td').value,done:false});mark('priv');refresh()},
  taskdel:t=>{P.tasks=P.tasks.filter(x=>x.id!==t.dataset.id);mark('priv');refresh()},
  bkadd:()=>{const v=$('bn').value.trim();if(!v)return;P.bookings.push({id:'b'+uid(),type:$('bt').value,title:v,date:$('bd').value,ref:$('br').value.trim(),status:$('bs').value,note:$('bo').value.trim()});mark('priv');refresh()},
  bkdel:t=>{P.bookings=P.bookings.filter(x=>x.id!==t.dataset.id);mark('priv');refresh()},
  bkst:t=>{const b=P.bookings.find(x=>x.id===t.dataset.id);b.status=b.status==='Potvrzeno'?'Čeká':'Potvrzeno';mark('priv');refresh()},
  noteadd:()=>{const t=$('nt').value.trim();if(!t)return;P.notes.push({id:'n'+uid(),t,x:$('nx').value});mark('priv');refresh()},
  notedel:t=>{P.notes=P.notes.filter(x=>x.id!==t.dataset.id);mark('priv');refresh()},
  vlim:()=>{P.limit=+$('vlim').value||0;mark('priv');refresh()},
  itemadd:()=>{const n=$('vn').value.trim(),k=P.pack.find(x=>x.id===$('vc').value);if(!n||!k)return;k.items.push({id:'i'+uid(),t:n,c:false,q:Math.max(1,+$('vq').value||1),w:Math.max(0,+$('vw').value||0)});mark('priv');refresh()},
  itemdel:t=>{const k=P.pack.find(x=>x.id===t.dataset.k);k.items=k.items.filter(i=>i.id!==t.dataset.i);mark('priv');refresh()},
  catadd:()=>{const n=$('vk').value.trim();if(!n)return;P.pack.push({id:'k'+uid(),name:n,items:[]});mark('priv');refresh()},
  catdel:t=>{const k=P.pack.find(x=>x.id===t.dataset.k);if(!confirm('Smazat kategorii „'+k.name+'“ včetně věcí?'))return;P.pack=P.pack.filter(x=>x.id!==k.id);mark('priv');refresh()},
  admsave:()=>{
    GH.owner=$('gho').value.trim();GH.repo=$('ghr').value.trim();GH.pr=$('ghp').value.trim();
    const t=$('ght').value.trim();if(t)TOKEN=t;
    LS.set('gh_cfg',{owner:GH.owner,repo:GH.repo,pr:GH.pr});LS.set('gh_token',TOKEN);
    enableEdit();refresh();
  },
  admout:()=>{TOKEN='';LS.del('gh_token');edit=false;go('home')},
  ratesave:()=>{CUR.forEach(([c])=>{if(c==='CZK')return;const v=parseFloat($('rt_'+c).value);if(v>0)P.rates[c]=v});mark('priv');refresh()},
  ratefetch:async()=>{
    try{const r=await fetch('https://open.er-api.com/v6/latest/CZK'),j=await r.json();
      CUR.forEach(([c])=>{if(c!=='CZK'&&j.rates&&j.rates[c])P.rates[c]=+(1/j.rates[c]).toPrecision(4)});
      mark('priv');refresh();
    }catch(e){fabMsg='Kurzy se nepodařilo stáhnout';fab()}
  },
  export:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({public:pubOut(),private:P},null,1)],{type:'application/json'}));a.download='cesta-zaloha.json';a.click()}
};
const CHG={
  wxsel:t=>{wxSel=t.value;refresh()},
  ecsel:t=>{const c=CCUR[t.value];if(c&&$('ecu'))$('ecu').value=c},
  tasktog:t=>{const x=P.tasks.find(x=>x.id===t.dataset.id);x.done=t.checked;mark('priv');refresh()},
  itemtog:t=>{const i=P.pack.find(k=>k.id===t.dataset.k).items.find(i=>i.id===t.dataset.i);i.c=t.checked;mark('priv');refresh()},
  import:t=>{
    const f=t.files[0];if(!f)return;
    f.text().then(x=>{const j=JSON.parse(x);if(j.public&&j.public.stops){S=j.public;S.diary=S.diary||[];S.places=S.places||[];S.photos=S.photos||[];sel=S.cur;dirty.pub=true}if(j.private){P=Object.assign(P,j.private);ensureP();mark('priv')}refresh()}).catch(()=>{fabMsg='Import selhal';fab()});
  }
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!t){if(moreOpen&&!e.target.closest('#sheet')){moreOpen=false;renderNav()}return}
  const f=ACT[t.dataset.act];if(!f)return;
  if(t.tagName==='A')e.preventDefault();
  f(t,e);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!$('lb').classList.contains('hide')){ACT.lbclose();return}if(moreOpen){moreOpen=false;renderNav()}return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role=button][data-act]')){e.preventDefault();e.target.click()}
});
document.addEventListener('change',e=>{const t=e.target.closest('[data-chg]');if(t&&CHG[t.dataset.chg])CHG[t.dataset.chg](t,e)});

/* ================= START ================= */
(function init(){
  if(TOKEN&&GH.owner&&GH.repo)edit=true;
  const h=location.hash.slice(1);if(viewOk(h))view=h;
  refresh();loadPublic();loadNews();loadAutoPhotos();loadPrivate();loadShared();checkShared();
  /* nová data se stahují jen při otevřené stránce (šetří data na roamingu) a hned po návratu do aplikace */
  let lastPoll=Date.now();
  const poll=()=>{if(document.hidden)return;lastPoll=Date.now();if(!edit&&!dirty.pub)loadPublic();loadNews();loadAutoPhotos();loadShared()};
  setInterval(poll,180000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastPoll>60000)poll()});
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
