name: Zprávy
on:
  schedule:
    - cron: "0 5 * * *"   # každý den v 05:00 UTC
  workflow_dispatch:       # ruční spuštění tlačítkem
permissions:
  contents: write
concurrency:
  group: zpravy
  cancel-in-progress: false
jobs:
  zpravy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Spustit agenta
        run: python zpravy.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Uložit zprávy
        run: |
          git config user.name "zpravy-bot"
          git config user.email "zpravy-bot@users.noreply.github.com"
          git add news.json
          if ! git diff --cached --quiet; then
            git commit -m "Aktualizace zpráv"
            git pull --rebase
            git push
          fi
