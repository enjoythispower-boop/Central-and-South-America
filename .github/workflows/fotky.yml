name: Fotky míst
on:
  push:
    branches: [main]
    paths: [state.json, fotky.py]    # po každém uložení trasy z aplikace (a po úpravě skriptu)
  schedule:
    - cron: "30 5 * * 1"   # jednou týdně znovu zkusit místa, ke kterým se fotka nenašla
  workflow_dispatch:       # ruční spuštění tlačítkem
permissions:
  contents: write
concurrency:
  group: fotky
  cancel-in-progress: false
jobs:
  fotky:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dohledat fotky nových míst (Wikipedie, bez klíčů)
        run: python fotky.py
      - name: Uložit fotky
        run: |
          git config user.name "fotky-bot"
          git config user.email "fotky-bot@users.noreply.github.com"
          git add photos/places/auto.json photos/places/auto 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Fotky nových míst"
            git pull --rebase
            git push
          fi
